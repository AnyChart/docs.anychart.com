<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggest Changes — AnyChart Documentation</title>

  <!-- Toast UI Editor -->
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">

  <!-- AnyChart brand font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f6f7;
      color: #222;
      min-height: 100vh;
    }

    /* Header bar */
    .header {
      background: #2485d0;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header a {
      color: #c9e8ff;
      text-decoration: none;
      font-size: 14px;
    }

    .header a:hover { color: #fff; }

    .header h1 {
      font-size: 18px;
      font-weight: 500;
      flex: 1;
    }

    /* Main layout */
    .container {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* File path badge */
    .file-path {
      background: #fff;
      border: 1px solid #d2d2d2;
      border-radius: 4px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #76797b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-path code {
      color: #c7254e;
      background: #f9f2f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 13px;
    }

    /* Editor wrapper */
    .editor-wrapper {
      background: #fff;
      border: 1px solid #d2d2d2;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* Submission form */
    .submit-form {
      background: #fff;
      border: 1px solid #d2d2d2;
      border-radius: 4px;
      padding: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #76797b;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d2d2d2;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      color: #222;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #2485d0;
      box-shadow: 0 0 0 2px rgba(36, 133, 208, 0.15);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group { flex: 1; }

    .form-hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 24px;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: #2485d0;
      color: #fff;
    }

    .btn-primary:hover { background: #1f77bc; }
    .btn-primary:disabled { background: #a0c8e8; cursor: not-allowed; }

    .btn-secondary {
      background: #f3f3f3;
      color: #76797b;
      border: 1px solid #d2d2d2;
    }

    .btn-secondary:hover { background: #e8e8e8; }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    /* Status messages */
    .status {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .status.error {
      display: block;
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .status a {
      color: inherit;
      font-weight: 600;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #76797b;
      font-size: 15px;
    }

    .loading .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #e0e0e0;
      border-top-color: #2485d0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error page */
    .error-page {
      text-align: center;
      padding: 60px 20px;
      color: #c62828;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { background: #1b1b1d; color: #e3e3e3; }
      .header { background: #2485d0; }
      .file-path { background: #242526; border-color: #3a3a3c; color: #a0a0a0; }
      .file-path code { color: #e06c75; background: #2d2d2d; }
      .editor-wrapper { background: #242526; border-color: #3a3a3c; }
      .submit-form { background: #242526; border-color: #3a3a3c; }
      .form-group input,
      .form-group textarea { background: #1b1b1d; border-color: #3a3a3c; color: #e3e3e3; }
      .form-group label { color: #a0a0a0; }
      .btn-secondary { background: #2d2d2d; border-color: #3a3a3c; color: #a0a0a0; }
    }

    /* Responsive */
    @media (max-width: 640px) {
      .form-row { flex-direction: column; gap: 0; }
      .container { padding: 0 10px; margin: 12px auto; }
      .actions { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <a href="/">&#8592; Back to Docs</a>
    <h1>Suggest Changes</h1>
  </div>

  <!-- Main content -->
  <div class="container">
    <!-- Loading state -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Loading document...</div>
    </div>

    <!-- Error state -->
    <div id="error-page" class="error-page" style="display:none"></div>

    <!-- Editor (hidden until content loads) -->
    <div id="editor-section" style="display:none">

      <div class="file-path">
        Editing: <code id="file-path-display"></code>
      </div>

      <div class="editor-wrapper">
        <div id="editor"></div>
      </div>

      <div class="submit-form">
        <div class="form-group">
          <label for="description">What did you change? *</label>
          <input type="text" id="description" placeholder="e.g., Fixed a typo in the chart configuration example" maxlength="200" required>
          <div class="form-hint">Brief description of your changes (5-200 characters)</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author-name">Your name (optional)</label>
            <input type="text" id="author-name" placeholder="Jane Doe" maxlength="100">
          </div>
          <div class="form-group">
            <label for="author-email">Your email (optional)</label>
            <input type="email" id="author-email" placeholder="jane@example.com" maxlength="200">
          </div>
        </div>

        <div class="actions">
          <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
          <button type="button" id="submit-btn" class="btn btn-primary" onclick="submitChanges()">
            Submit for Review
          </button>
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>
  </div>

  <!-- Toast UI Editor JS -->
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

  <script>
    // API base — same origin in production, localhost:3001 in dev
    const API_BASE = window.location.hostname === 'localhost' && window.location.port !== '3001'
      ? 'http://localhost:3001'
      : '';

    let editor = null;
    let originalContent = '';
    let filePath = '';

    // Parse ?path= from URL
    const params = new URLSearchParams(window.location.search);
    filePath = params.get('path') || '';

    if (!filePath) {
      showError('No file path specified. Please use a "Suggest Changes" link from a documentation page.');
    } else {
      loadContent();
    }

    async function loadContent() {
      try {
        const res = await fetch(`${API_BASE}/api/content?path=${encodeURIComponent(filePath)}`);
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        const data = await res.json();
        originalContent = data.content;

        // Show editor
        document.getElementById('loading').style.display = 'none';
        document.getElementById('editor-section').style.display = 'block';
        document.getElementById('file-path-display').textContent = data.path;

        // Initialize Toast UI Editor
        editor = new toastui.Editor({
          el: document.getElementById('editor'),
          height: '500px',
          initialEditType: 'wysiwyg',
          initialValue: originalContent,
          previewStyle: 'vertical',
          usageStatistics: false,
          toolbarItems: [
            ['heading', 'bold', 'italic', 'strike'],
            ['hr', 'quote'],
            ['ul', 'ol', 'task'],
            ['table', 'link'],
            ['code', 'codeblock'],
            ['scrollSync'],
          ],
        });
      } catch (err) {
        showError(`Failed to load document: ${err.message}`);
      }
    }

    async function submitChanges() {
      const description = document.getElementById('description').value.trim();
      const authorName = document.getElementById('author-name').value.trim();
      const authorEmail = document.getElementById('author-email').value.trim();
      const content = editor.getMarkdown();
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submit-btn');

      // Validate
      if (description.length < 5) {
        showStatus('error', 'Please provide a description of your changes (at least 5 characters).');
        return;
      }

      if (content.trim() === originalContent.trim()) {
        showStatus('error', 'No changes detected. Please modify the document before submitting.');
        return;
      }

      // Build author string
      let author = '';
      if (authorName && authorEmail) {
        author = `${authorName} <${authorEmail}>`;
      } else if (authorName) {
        author = authorName;
      } else if (authorEmail) {
        author = authorEmail;
      }

      // Submit
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      statusEl.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/suggest`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: filePath, content, description, author }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Submission failed');
        }

        showStatus('success',
          `Your changes have been submitted for review! ` +
          `<a href="${data.pr_url}" target="_blank" rel="noopener">View Pull Request #${data.pr_number}</a>`
        );

        submitBtn.textContent = 'Submitted';
      } catch (err) {
        showStatus('error', err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit for Review';
      }
    }

    function showStatus(type, message) {
      const el = document.getElementById('status');
      el.className = `status ${type}`;
      el.innerHTML = message;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error-page');
      el.style.display = 'block';
      el.innerHTML = `<h2>Error</h2><p>${message}</p><p><a href="/">Return to Documentation</a></p>`;
    }
  </script>

</body>
</html>
