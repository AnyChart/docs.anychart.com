<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Stream Graph 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-stream-graph.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Label position:</span>
    <label><input type="radio" name="pos" onclick="changePosition('center-top')"> center-top</label>
    <label><input type="radio" name="pos" checked onclick="changePosition('center')"> center</label>
    <label><input type="radio" name="pos" onclick="changePosition('center-bottom')"> center-bottom</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var searchData = [
    ["W1", 42], ["W2", 45], ["W3", 40], ["W4", 38], ["W5", 44],
    ["W6", 50], ["W7", 55], ["W8", 52], ["W9", 48], ["W10", 46]
  ];
  var socialData = [
    ["W1", 30],["W2", 33],["W3", 36],["W4", 40],["W5", 38],
    ["W6", 35],["W7", 37],["W8", 42],["W9", 46],["W10", 49]
  ];
  var emailData = [
    ["W1", 18],["W2", 16],["W3", 19],["W4", 21],["W5", 20],
    ["W6", 22],["W7", 19],["W8", 17],["W9", 20],["W10", 18]
  ];

  // create a chart
  chart = anychart.streamGraph();
  // set the chart title
  chart.title("Stream Graph: Layer Labels");

  // add a series (layer) per channel
  chart.splineArea(searchData).name("Search");
  chart.splineArea(socialData).name("Social");
  chart.splineArea(emailData).name("Email");

  // show the layer name and its largest value
  chart.maxLabels().format("{%seriesName}: {%value}");

  // make the layer labels readable
  chart.maxLabels().fontColor("#000000");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// move the layer labels inside the bands: the chart redraws itself
function changePosition(value) {
  for (var i = 0; i < chart.getSeriesCount(); i++) {
    chart.getSeriesAt(i).maxLabels().position(value);
  }
}
</script>
</body>
</html>
