<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Stream Graph 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-stream-graph.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var searchData = [
    ["W1", 42],["W2", 45],["W3", 40],["W4", 38],["W5", 44],
    ["W6", 50],["W7", 55],["W8", 52],["W9", 48],["W10", 46]
  ];
  var socialData = [
    ["W1", 30],["W2", 33],["W3", 36],["W4", 40],["W5", 38],
    ["W6", 35],["W7", 37],["W8", 42],["W9", 46],["W10", 49]
  ];
  var emailData = [
    ["W1", 18],["W2", 20],["W3", 19],["W4", 22],["W5", 24],
    ["W6", 23],["W7", 21],["W8", 20],["W9", 22],["W10", 25]
  ];

  // create a chart
  var chart = anychart.streamGraph();
  // set the chart title and separate it from the stream
  chart.title("Stream Graph: Tooltips");
  chart.title().padding(0, 0, 20, 0);

  // add a series (layer) per channel
  var series1 = chart.splineArea(searchData);
  series1.name("Search");
  var series2 = chart.splineArea(socialData);
  series2.name("Social");
  var series3 = chart.splineArea(emailData);
  series3.name("Email");

  // allow HTML tags in the tooltip text
  chart.tooltip().useHtml(true);

  // the title shows the hovered category and the total of all layers
  chart.tooltip().titleFormat(function () {
    var total = 0;
    for (var i = 0; i < this.points.length; i++) {
      total += this.points[i].value;
    }
    return this.x + " &middot; total <b>" + total + "k</b>";
  });

  // format the line of each layer
  chart.tooltip().format("{%seriesName}: <b>{%value}k</b>");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
