<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="STOCK Range Area 02"/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // set the data
    table = anychart.data.table('x');
    table.addData([
{x: '2022-01-01', low: 2, high: 6},
{x: '2022-02-01', low: 2, high: 7},
{x: '2022-03-02', low: 3, high: 10},
{x: '2022-04-02', low: 5, high: 13},
{x: '2022-05-02', low: 8, high: 17},
{x: '2022-06-02', low: 11, high: 20},
{x: '2022-07-02', low: 13, high: 22},
{x: '2022-08-02', low: 13, high: 21},
{x: '2022-09-02', low: 11, high: 19},
{x: '2022-10-02', low: 8, high: 14},
{x: '2022-11-02', low: 5, high: 10},
{x: '2022-12-02', low: 5, high: 7},
{x: '2023-01-02', low: 3, high: 7},
{x: '2023-02-02', low: 4, high: 7},
{x: '2023-03-02', low: 5, high: 8},
{x: '2023-04-02', low: 7, high: 12},
{x: '2023-05-02', low: 7, high: 14},
{x: '2023-06-02', low: 13, high: 23},
{x: '2023-07-02', low: 15, high: 24},
{x: '2023-08-02', low: 11, high: 20},
{x: '2023-09-02', low: 10, high: 20},
{x: '2023-10-02', low: 7, high: 15},
{x: '2023-11-02', low: 5, high: 11},
{x: '2023-12-02', low: 1, high: 9},
{x: '2024-01-02', low: 2, high: 6},
{x: '2024-02-02', low: 6, high: 9},
{x: '2024-03-01', low: 7, high: 11},
{x: '2024-04-01', low: 9, high: 14},
{x: '2024-05-01', low: 11, high: 17},
{x: '2024-06-01', low: 18, high: 19},
{x: '2024-07-01', low: 19, high: 22}
    ]);
  
    // map the data
    mapping = table.mapAs({x:'x', high:'high', low: 'low'});

    // chart type
    var chart = anychart.stock();

    // set the series
    var series = chart.plot(0).rangeArea(mapping);
    series.name("Temperature Range");

    chart.title('The temperature range in London \n2000-2004');

    // display the chart
    chart.container('container');
    chart.draw();
});
</script>
</body>
</html>
