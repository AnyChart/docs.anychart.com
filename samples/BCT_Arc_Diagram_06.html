<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 06"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Color mode:</span>
    <label><input type="radio" name="mode" id="modeSource" onclick="changeColorMode('source')"> source</label>
    <label><input type="radio" name="mode" id="modeTarget" onclick="changeColorMode('target')"> target</label>
    <label><input type="radio" name="mode" id="modeGradient" onclick="changeColorMode('gradient')" checked> gradient</label>
    <label><input type="radio" name="mode" id="modeReversed" onclick="changeColorMode('reversed')"> gradient, reversed</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: requests between the departments of a company
  var data = [
    {from: "Sales", to: "Marketing", weight: 9},
    {from: "Sales", to: "Finance", weight: 16},
    {from: "Finance", to: "HR", weight: 5},
    {from: "Support", to: "Sales", weight: 14},
    {from: "Support", to: "Marketing", weight: 6},
    {from: "Marketing", to: "HR", weight: 3}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title and separate it from the diagram
  chart.title("Arc Diagram: Color Mode");
  chart.title().padding(0, 0, 20, 0);

  // give the nodes room: wider bars and more spacing between them
  chart.nodeWidth(30);
  chart.nodeSpacing(90);

  // one palette color per node
  chart.palette(["#5b8ff9", "#61ddaa", "#65789b", "#f6bd16", "#7262fd"]);

  // blend each link from the color of its source node to the color of its target node
  chart.colorMode("gradient");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// apply the chosen color mode: the chart redraws itself
function changeColorMode(value) {
  chart.colorMode(value == "reversed" ? "gradient" : value);
  chart.reverseGradient(value == "reversed");
}
</script>
</body>
</html>
