<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 06"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Sort nodes:</span>
    <label><input type="radio" name="sort" id="sortName" onclick="changeSortOrder('name')"> by name</label>
    <label><input type="radio" name="sort" id="sortWeight" onclick="changeSortOrder('weight')" checked> by total flow</label>
    <label><input type="radio" name="sort" id="sortGroup" onclick="changeSortOrder('group')"> by group</label>
    <label><input type="radio" name="sort" id="sortData" onclick="changeSortOrder('data')"> data order</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: migration flows between regions, with a group per link
  var data = [
    {from: "Asia", to: "Europe", weight: 42, group: "Eurasia"},
    {from: "Asia", to: "N. America", weight: 51, group: "Eurasia"},
    {from: "Asia", to: "Oceania", weight: 18, group: "Eurasia"},
    {from: "Africa", to: "Europe", weight: 38, group: "Africa-Europe"},
    {from: "Africa", to: "N. America", weight: 9, group: "Africa-Europe"},
    {from: "S. America", to: "N. America", weight: 44, group: "Americas"},
    {from: "S. America", to: "Europe", weight: 16, group: "Americas"},
    {from: "Europe", to: "N. America", weight: 33, group: "Americas"},
    {from: "N. America", to: "Oceania", weight: 7, group: "Americas"},
    {from: "Oceania", to: "Asia", weight: 6, group: "Eurasia"}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title and separate it from the diagram
  chart.title("Arc Diagram: Sorting");
  chart.title().padding(0, 0, 20, 0);

  // order the nodes by their total flow instead of by name
  chart.sortOrder("weight");

  // one fill per group, so the clusters are visible in the group order
  chart.node().normal().fill(function () {
    return groupColors[this.group];
  });

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// one color per group of nodes
var groupColors = {"Eurasia": "#5b8ff9", "Africa-Europe": "#f6bd16", "Americas": "#61ddaa"};

// the position of each node in the data, for the data-order comparator
var dataOrder = {"Asia": 0, "Europe": 1, "N. America": 2, "Oceania": 3, "Africa": 4, "S. America": 5};

// keep the nodes in the order they appear in the data: a comparator
function byDataOrder(node1, node2) {
  return dataOrder[node1.id] - dataOrder[node2.id];
}

// apply the chosen order: the chart redraws itself
function changeSortOrder(value) {
  chart.sortOrder(value == "data" ? byDataOrder : value);
}
</script>
</body>
</html>
