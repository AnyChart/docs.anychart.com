<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/feat-staging-preview/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data for two series
  var seriesData_1 = [
    {x: "January", value: 10000},
    {x: "February", value: 12000},
    {x: "March", value: 18000},
    {x: "April", value: 11000},
    {x: "May", value: 9000}
  ];
  var seriesData_2 = [
    {x: "January", value: 7000},
    {x: "February", value: 9000},
    {x: "March", value: 13000},
    {x: "April", value: 8000},
    {x: "May", value: 6000}
  ];

  // create a column chart
  var chart = anychart.column();
  chart.title("Lollipop Chart: Appearance");

  // create the first lollipop series and configure its appearance
  var series1 = chart.lollipop(seriesData_1);
  series1.normal().stroke("#00cc99", 2);
  series1.normal().fill("#00cc99");
  series1.hovered().stroke("#00cc99", 3);
  series1.hovered().fill("#00cc99");
  series1.selected().stroke("#00cc99", 4);
  series1.selected().fill("#00cc99");

  // create the second lollipop series and configure its appearance
  var series2 = chart.lollipop(seriesData_2);
  series2.normal().stroke("#0066cc", 2);
  series2.normal().fill("#0066cc");
  series2.hovered().stroke("#0066cc", 3);
  series2.hovered().fill("#0066cc");
  series2.selected().stroke("#0066cc", 4);
  series2.selected().fill("#0066cc");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
