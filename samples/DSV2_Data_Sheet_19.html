<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 19"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Rows the source holds <output id="total"></output></label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // the catalog a backend of your own would hold
  var catalog = [];
  for (var i = 1; i <= 40; i++) {
    catalog.push({product: "Item " + i, category: i % 2 ? "Tech" : "Office", price: 50 + i * 5, units: i * 3});
  }

  // hand back one page of the catalog
  function loadPage(page, pageSize) {
    var first = page * pageSize;
    return catalog.slice(first, first + pageSize);
  }

  // create a data sheet with no rows of its own
  var grid = anychart.dataSheet();

  // the grid calls this function when it draws, for the first page
  grid.dataSource().setAdapter(function (params, callback) {
    callback({data: loadPage(params.page, params.pageSize), total: catalog.length});
  });

  // ask for eight rows in that request
  grid.dataSource().pageSize(8);

  // set the container id
  grid.container("container");

  // initiate drawing the data sheet
  grid.draw();

  // the total the source reported in its response
  var total = grid.dataSource().totalRows();
  document.getElementById("total").value = total;
});
</script>
</body>
</html>
