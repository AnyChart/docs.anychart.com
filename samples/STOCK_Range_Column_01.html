<!DOCTYPE html>
<html>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>

        html, body, #container {
            width: 100%;

            margin: 0;

        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // set the data
  table = anychart.data.table();
  table.addData([
['2023-01-01', 5.8, 7.9],
['2023-02-01', 4.6, 6.1],
['2023-03-01', 5.9, 8.1],
['2023-04-01', 7.8, 10.7],
['2023-05-01', 10.5, 13.7],
['2023-06-01', 13.8, 17],
['2023-07-01', 16.5, 18.5],
['2023-08-31', 17.8, 19],
['2023-09-01', 15.4, 17.8],
['2023-10-01', 12.7, 15.3],
['2023-11-01', 9.8, 13],
['2023-12-01', 9, 10.1],
['2023-01-01', 5.7, 8],
['2024-02-01', 6, 8.4],
['2024-03-01', 6, 9.5],
['2024-04-01', 7.7, 10],
['2024-05-01', 8.9, 11.1],
['2024-06-01', 10.2, 16.3],
['2024-07-01', 14.3, 19],
['2024-08-01', 16, 20.1],
['2024-09-01', 15.8, 18.9],
['2024-10-01', 11.4, 13.2],
['2024-11-01', 8.3, 10],
['2024-12-01', 6.5, 8.7],
['2025-01-01', 7.2, 8.6],
['2025-02-01', 5.3, 7.4],
['2025-03-01', 6.1, 9.4],
['2025-04-01', 8.7, 11.2],        
['2025-05-21', 10.4, 14.3],
['2025-06-22', 13.5, 17.1],
['2025-07-23', 15.8, 19.7],
['2025-08-24', 17.8, 21],
['2025-09-25', 15.1, 17.3],
['2025-10-26', 12.6, 15.9],
['2025-11-27', 10.2, 13.8],
['2025-12-28', 8.3, 9.6]
  ]);
  
  // map the data
  mapping = table.mapAs();
  mapping.addField('low', 1);
  mapping.addField('high', 2);

  // chart type
  var chart = anychart.stock();

  // set the series
  var series = chart.plot(0).rangeColumn(mapping);
  series.name("Water temperature in London in 2023-2025");

  chart.title('Water Temperature');
  
  chart.container('container');
  chart.draw();
});
</script>
</body>
</html>
