<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // set the data
  table = anychart.data.table();
  table.addData([
['2024-01-05', 5.8, 7.9],
['2024-02-05', 4.6, 6.1],
['2024-03-04', 5.9, 8.1],

['2024-10-04', 12.7, 15.3],
['2024-11-04', 9.8, 13],
['2024-12-04', 9, 10.1],
['2024-01-05', 5.7, 8],
['2025-02-04', 6, 8.4],
['2025-03-04', 6, 9.5],
['2025-04-04', 7.7, 10],
['2025-05-04', 8.9, 11.1],

['2026-10-30', 12.6, 15.9],
['2026-12-01', 10.2, 13.8],
['2027-01-01', 8.3, 9.6]
  ]);
  
  // map the data
  mapping = table.mapAs();
  mapping.addField('low', 1);
  mapping.addField('high', 2);

  // chart type
  var chart = anychart.stock();

  // set the series
  var series = chart.plot(0).rangeColumn(mapping);
  series.name("Water temperature in London in 2010-2012");

  chart.title('Water Temperature');
  
  chart.container('container');
  chart.draw();
});
</script>
</body>
