<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="STOCK Crosshair 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
        
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label><input onclick="displayMode('sticky')" type="radio" name="mode" checked> Sticky</label>
    <label><input onclick="displayMode('float')" type="radio" name="mode"> Float</label>
    <label><input onclick="displayMode('sticky-x')" type="radio" name="mode"> Sticky X</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // create a data table
    var dataTable = anychart.data.table();
    dataTable.addData([
      ['2025-12-27', 19.87],
      ['2025-12-28', 20.08],
      ['2025-12-29', 19.95],
      ['2025-12-30', 20.1],
      ['2025-12-31', 19.91],
      ['2026-01-01', 20.1],
      ['2026-01-02', 19.91],
      ['2026-01-03', 19.36],
      ['2026-01-04', 19.08],
      ['2026-01-05', 19.2],
      ['2026-01-06', 18.99],
      ['2026-01-07', 18.92],
      ['2026-01-08', 18.41],
      ['2026-01-09', 18.57],
      ['2026-01-10', 18.61],
      ['2026-01-11', 19.03],
      ['2026-01-12', 18.91],
      ['2026-01-13', 18.99],
      ['2026-01-14', 18.65]  
      ]);

    // map the data
    mapping = dataTable.mapAs({value: 1});

    // create a stock chart
    chart = anychart.stock();

    // create a plot and a line series
    chart.plot(0).line(mapping);

    // set the chart title
    chart.title("Crosshair: Display Mode = " +
                chart.crosshair().displayMode());

    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();
});

// set the display mode of the crosshair
function displayMode(mode) {
  chart.crosshair().displayMode(mode);
  // update the chart title
  chart.title("Crosshair: Display Mode = " +
              chart.crosshair().displayMode());
}
</script>
</body>
</html>
