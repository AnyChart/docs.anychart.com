<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns: x, value, and (for one point) a custom fill color
  var dataSet = anychart.data.set([
    ["January", 10000],
    ["February", 12000],
    ["March", 18000, "#5cd65c"],
    ["April", 11000],
    ["May", 9000]
  ]);
  var mapping = dataSet.mapAs({x: 0, value: 1, fill: 2});

  var chart = anychart.lollipop();
  chart.title("Lollipop Chart: Individual Points (Data Mapping)");
  var series = chart.lollipop(mapping);

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
