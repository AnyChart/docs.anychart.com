<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var data = [
    {x: "January", value: 10000},{x: "February", value: 12000},{x: "March", value: 18000},{x: "April", value: 11000},{x: "May", value: 9000}
  ];

  var chart = anychart.lollipop();
  chart.title("Lollipop Chart: Head and Stick Size");

  var series = chart.lollipop(data);

  // enlarge the round head (default radius is 5px)
  series.markers().size(10);

  // the stick thickness is the stroke width
  series.normal().stroke("#0066cc", 3);
});
</script>
</body>
</html>
