<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns: x, value, and (for one point) a custom fill color
  var dataSet = anychart.data.set([
    ["January", 10000],
    ["February", 12000],
    ["March", 18000, "#5cd65c"],
    ["April", 11000],
    ["May", 9000]
  ]);
  // map the data
  var mapping = dataSet.mapAs({x: 0, value: 1, fill: 2});

  // create a lollipop chart
  var chart = anychart.lollipop();
  // set the chart title
  chart.title("Lollipop Chart: Individual Points (Data Mapping)");
  // create a lollipop series and set the data
  var series = chart.lollipop(mapping);

  // set the container id and draw
  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
