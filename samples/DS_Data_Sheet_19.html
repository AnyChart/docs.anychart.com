<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 19"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // the data
  var data = [
    {id: 1, product: 'Laptop',   category: 'Tech',   price: 1200, stock: 34,  supplier: 'Northwind'},
    {id: 2, product: 'Chair',    category: 'Office', price: 150,  stock: 120, supplier: 'Contoso'},
    {id: 3, product: 'Monitor',  category: 'Tech',   price: 300,  stock: 58,  supplier: 'Northwind'},
    {id: 4, product: 'Desk',     category: 'Office', price: 450,  stock: 21,  supplier: 'Fabrikam'},
    {id: 5, product: 'Keyboard', category: 'Tech',   price: 80,   stock: 240, supplier: 'Contoso'},
    {id: 6, product: 'Lamp',     category: 'Office', price: 45,   stock: 175, supplier: 'Fabrikam'},
    {id: 7, product: 'Headset',  category: 'Tech',   price: 220,  stock: 96,  supplier: 'Northwind'},
    {id: 8, product: 'Cabinet',  category: 'Office', price: 380,  stock: 12,  supplier: 'Contoso'}
  ];

  // add a button bar and a preview panel above the grid
  var container = document.getElementById('container');
  var bar = document.createElement('div');
  bar.style.cssText = 'height:150px;padding:8px;box-sizing:border-box;font:13px Arial,sans-serif';
  bar.innerHTML =
    '<button id="csv">Export CSV</button> ' +
    '<button id="json">Export JSON</button> ' +
    '<button id="print">Print</button> ' +
    '<span>the file is downloaded as well</span>' +
    '<pre id="out" style="margin:6px 0 0;padding:6px;height:96px;overflow:auto;' +
    'background:#f5f5f5;border:1px solid #e0e0e0;font:12px monospace">press Export CSV</pre>';
  document.body.insertBefore(bar, container);
  container.style.height = 'calc(100% - 150px)';

  // create a data sheet
  var chart = anychart.dataSheet(data);

  // declare the columns - the price cells show a currency sign
  chart.column(0, {field: 'product',  title: 'Product',  width: 150});
  chart.column(1, {field: 'category', title: 'Category', width: 120});
  chart.column(2, {field: 'price',    title: 'Price',    width: 110, dataType: 'number', format: '${%value}'});
  chart.column(3, {field: 'stock',    title: 'Units',    width: 110, dataType: 'number'});

  // the export follows the current filter and sorting
  chart.filter().filterBy('category', {type: 'text', mode: 'exact', value: 'Tech'});

  var out = document.getElementById('out');

  // csv() returns the text AND downloads the file
  // the exported price is the raw 1200, not the $1200 shown in the cell
  document.getElementById('csv').onclick = function () {
    out.textContent = chart.export().csv({filename: 'products', separator: ','});
  };

  // json() only downloads, it returns nothing
  document.getElementById('json').onclick = function () {
    chart.export().json({filename: 'products', pretty: true});
    out.textContent = 'products.json downloaded';
  };

  // print() opens the print dialog of the browser
  document.getElementById('print').onclick = function () {
    chart.print({title: 'Tech products', orientation: 'landscape', pageSize: 'A4'});
  };

  // set the container id and draw
  chart.container('container');
  chart.draw();

});
</script>
</body>
</html>
