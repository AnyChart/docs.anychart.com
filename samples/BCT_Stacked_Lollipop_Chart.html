<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Stacked Lollipop Chart"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/feat-staging-preview/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var seriesData_1 = [
    {x: "January", value: 10000},{x: "February", value: 12000},{x: "March", value: 18000},{x: "April", value: 11000},{x: "May", value: 9000}
  ];
  var seriesData_2 = [
    {x: "January", value: 7000},{x: "February", value: 9000},{x: "March", value: 8000},{x: "April", value: 6000},{x: "May", value: 5000}
  ];
  var chart = anychart.column();
  chart.title("Stacked Lollipop Chart");
  chart.yScale().stackMode("value");
  var series1 = chart.lollipop(seriesData_1); series1.name("2023");
  var series2 = chart.lollipop(seriesData_2); series2.name("2024");
  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
