<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #controls output { display: inline-block; text-align: left; }
        #maxCountValue, #connectorValue { min-width: 3ch; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Labels that do not fit:</span>
    <label><input type="radio" name="overflow" id="overflowHide" onclick="changeOverflow('hide')"> hide</label>
    <label><input type="radio" name="overflow" id="overflowStack" onclick="changeOverflow('stack')" checked> stack</label>
    <label>Max labels
        <input type="range" min="4" max="24" step="1" value="24" oninput="changeMaxCount(this.value)">
        <output id="maxCountValue">24</output>
    </label>
    <label>Connector length
        <input type="range" min="0" max="120" step="10" value="20" oninput="changeConnectorMaxLength(this.value)">
        <output id="connectorValue">20</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: weekly flights between European airports
  var data = [
    {from: "London", to: "Paris", weight: 182},
    {from: "London", to: "Amsterdam", weight: 154},
    {from: "London", to: "Dublin", weight: 168},
    {from: "London", to: "Frankfurt", weight: 112},
    {from: "London", to: "Madrid", weight: 98},
    {from: "London", to: "Barcelona", weight: 105},
    {from: "London", to: "Rome", weight: 77},
    {from: "London", to: "Zurich", weight: 84},
    {from: "London", to: "Copenhagen", weight: 56},
    {from: "London", to: "Istanbul", weight: 49},
    {from: "Paris", to: "Amsterdam", weight: 91},
    {from: "Paris", to: "Madrid", weight: 88},
    {from: "Paris", to: "Rome", weight: 74},
    {from: "Paris", to: "Lisbon", weight: 52},
    {from: "Paris", to: "Munich", weight: 63},
    {from: "Paris", to: "Brussels", weight: 28},
    {from: "Amsterdam", to: "Frankfurt", weight: 86},
    {from: "Amsterdam", to: "Copenhagen", weight: 70},
    {from: "Amsterdam", to: "Oslo", weight: 45},
    {from: "Amsterdam", to: "Warsaw", weight: 42},
    {from: "Amsterdam", to: "Barcelona", weight: 66},
    {from: "Amsterdam", to: "Dublin", weight: 59},
    {from: "Frankfurt", to: "Munich", weight: 94},
    {from: "Frankfurt", to: "Berlin", weight: 89},
    {from: "Frankfurt", to: "Vienna", weight: 67},
    {from: "Frankfurt", to: "Prague", weight: 35},
    {from: "Frankfurt", to: "Athens", weight: 31},
    {from: "Madrid", to: "Barcelona", weight: 147},
    {from: "Madrid", to: "Lisbon", weight: 76},
    {from: "Madrid", to: "Rome", weight: 48},
    {from: "Barcelona", to: "Milan", weight: 44},
    {from: "Rome", to: "Milan", weight: 103},
    {from: "Rome", to: "Athens", weight: 58},
    {from: "Munich", to: "Vienna", weight: 72},
    {from: "Munich", to: "Berlin", weight: 61},
    {from: "Zurich", to: "Vienna", weight: 39},
    {from: "Vienna", to: "Budapest", weight: 33},
    {from: "Vienna", to: "Berlin", weight: 41},
    {from: "Warsaw", to: "Prague", weight: 26},
    {from: "Copenhagen", to: "Stockholm", weight: 85},
    {from: "Stockholm", to: "Helsinki", weight: 79},
    {from: "Oslo", to: "Stockholm", weight: 68},
    {from: "Istanbul", to: "Athens", weight: 37},
    {from: "Brussels", to: "Milan", weight: 22},
    {from: "Budapest", to: "Istanbul", weight: 19}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title
  chart.title("Arc Diagram: Node Labels");

  // node labels: blue
  chart.node().normal().labels().fontColor("#1976d2");

  // the label of the node under the pointer, and of a selected node
  chart.node().hovered().labels().fontColor("#0b1220");
  chart.node().selected().labels().fontColor("#d32f2f");

  // stack the node labels that do not fit, cap their number and the connector length
  chart.node().labels().overflow("stack");
  chart.node().labels().maxCount(24);
  chart.node().labels().connectorMaxLength(20);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();

});

// stack the node labels that do not fit, or hide them: the chart redraws itself
function changeOverflow(value) {
  chart.node().labels().overflow(value);
}

// set how many node labels the chart may place
function changeMaxCount(value) {
  chart.node().labels().maxCount(value);
  document.getElementById("maxCountValue").value = value;
}


// set how long the connector line of a node label may be
function changeConnectorMaxLength(value) {
  chart.node().labels().connectorMaxLength(value);
  document.getElementById("connectorValue").value = value;
}

</script>
</body>
</html>
