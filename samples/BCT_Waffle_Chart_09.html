<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 09"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // a progress-style waffle: the share completed vs the remainder
  var data = [
    {name: "Completed", value: 68},
    {name: "Remaining", value: 32}
  ];

  var chart = anychart.waffle(data);
  chart.title("Waffle Chart: Fill Direction");

  chart.palette(["#1976d2", "#e3e9ef"]);

  // fill the grid from the bottom up
  chart.fillDirection("bottom-to-top");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
