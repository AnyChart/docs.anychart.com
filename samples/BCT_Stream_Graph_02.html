<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Stream Graph 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-stream-graph.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // one data set with a column per channel: [week, search, social]; the social value at W5 is missing
  var dataSet = anychart.data.set([
    ["W1", 42, 30],["W2", 45, 33],["W3", 40, 36],["W4", 38, 40],["W5", 44, null],
    ["W6", 50, 35],["W7", 55, 37],["W8", 52, 42],["W9", 48, 46],["W10", 46, 49]
  ]);

  // map a column of the data set for each series
  var searchMapping = dataSet.mapAs({x: 0, value: 1});
  var socialMapping = dataSet.mapAs({x: 0, value: 2});

  var chart = anychart.streamGraph();
  chart.title("Stream Graph: Data via data.set");

  var series1 = chart.splineArea(searchMapping);
  series1.name("Search");
  var series2 = chart.splineArea(socialMapping);
  series2.name("Social");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
