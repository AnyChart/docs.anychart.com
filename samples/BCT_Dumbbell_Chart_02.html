<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dumbbell Chart 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var seriesData_1 = [
    {x: "Job A", low: 40000, high: 60000},{x: "Job B", low: 50000, high: 80000},{x: "Job C", low: 35000, high: 55000}
  ];
  var seriesData_2 = [
    {x: "Job A", low: 30000, high: 45000},{x: "Job B", low: 42000, high: 62000},{x: "Job C", low: 28000, high: 40000}
  ];

  var chart = anychart.line();
  chart.title("Dumbbell Chart: Appearance");

  var series1 = chart.dumbbell(seriesData_1);
  series1.normal().stroke("#00cc99", 1);
  series1.normal().lowFill("#99e6d4");
  series1.normal().highFill("#00cc99");
  series1.hovered().stroke("#00cc99", 2);
  series1.selected().stroke("#00cc99", 4);

  var series2 = chart.dumbbell(seriesData_2);
  series2.normal().stroke("#0066cc", 1);
  series2.normal().lowFill("#99c2eb");
  series2.normal().highFill("#0066cc");
  series2.hovered().stroke("#0066cc", 2);
  series2.selected().stroke("#0066cc", 4);

  // show both endpoint values in the tooltip
  chart.tooltip().format("High: {%high}, Low: {%low}");

  // set the container id and draw
  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
