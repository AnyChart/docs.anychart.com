<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dumbbell Chart 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/feat-staging-preview/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data for two series
  var seriesData_1 = [
    ["Job A", 40000, 60000],
    ["Job B", 50000, 80000],
    ["Job C", 35000, 55000]
  ];
  var seriesData_2 = [
    ["Job A", 30000, 45000],
    ["Job B", 42000, 62000],
    ["Job C", 28000, 40000]
  ];

  // create a line chart
  var chart = anychart.line();
  chart.title("Dumbbell Chart: Appearance");

  // create the first dumbbell series and configure its appearance
  var series1 = chart.dumbbell(seriesData_1);
  series1.normal().stroke("#00cc99", 1);
  series1.normal().lowFill("#00cc99");
  series1.normal().highFill("#004d38");
  series1.hovered().stroke("#00cc99", 2);
  series1.selected().stroke("#00cc99", 4);

  // create the second dumbbell series and configure its appearance
  var series2 = chart.dumbbell(seriesData_2);
  series2.normal().stroke("#0066cc", 1);
  series2.normal().lowFill("#0066cc");
  series2.normal().highFill("#003366");
  series2.hovered().stroke("#0066cc", 2);
  series2.selected().stroke("#0066cc", 4);

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
