<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dumbbell Chart 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: old salary as low, new salary as high
  var data = [
    {x: "Anna", low: 52000, high: 58000},
    {x: "Ben", low: 48000, high: 50000},
    {x: "Carol", low: 61000, high: 70000},
    {x: "Dan", low: 55000, high: 59000},
    {x: "Eva", low: 44000, high: 51000}
  ];

  // create a chart
  var chart = anychart.dumbbell();

  // set the chart title
  chart.title("Dumbbell Chart: Appearance");

  // create a dumbbell series and set the data
  var series = chart.dumbbell(data);

  // gray = old salary, green = new salary
  series.normal().lowFill("#b3b3b3");
  series.normal().lowStroke("#b3b3b3");
  series.normal().highFill("#00cc99");
  series.normal().highStroke("#00cc99");

  // set the connecting line in all three states
  series.normal().stroke("#b3b3b3", 1);
  series.hovered().stroke("#b3b3b3", 2);
  series.selected().stroke("#b3b3b3", 4);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
