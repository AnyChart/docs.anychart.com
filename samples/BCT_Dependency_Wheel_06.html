<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dependency Wheel 06"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-dependency-wheel.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    {from: "Coal", to: "Grid", weight: 38},
    {from: "Gas", to: "Grid", weight: 46},
    {from: "Wind", to: "Grid", weight: 25},
    {from: "Sun", to: "Grid", weight: 17},
    {from: "Grid", to: "Homes", weight: 74},
    {from: "Grid", to: "Firms", weight: 52}
  ];

  // create a chart and set the data
  var chart = anychart.dependencyWheel(data);
  // set the chart title
  chart.title("Dependency Wheel: Node Settings");

  // states of the node arcs
  chart.node().normal().stroke("#ffffff", 1);
  chart.node().hovered().stroke("#1b2740", 2);
  chart.node().selected().stroke("#0b1220", 3);

  // node labels: add the share of the total flow to the name
  chart.node().normal().labels().format("{%name}\n{%percent}{decimalsCount:1}%");

  // show every label, even if some of them collide
  chart.dropOverlappedLabels(false);

  // select the "Grid" node from code
  chart.select(["Grid"]);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
