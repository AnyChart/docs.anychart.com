<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Org Chart 11"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-org-chart.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls span { font-weight: 600; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <button onclick="zoomInStep()">Zoom in</button>
    <button onclick="zoomOutStep()">Zoom out</button>
    <button onclick="fitTree()">Fit</button>
    <label>Zoom: <output id="zoomLevel">1</output></label>
    <span>Panning bounds:</span>
    <label><input type="radio" name="bounds" onclick="boundsContain()" checked> contain</label>
    <label><input type="radio" name="bounds" onclick="boundsFree()"> free</label>
    <label><input type="radio" name="bounds" onclick="boundsAutoCenter()"> auto-center</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: a flat table with id/parent references
  var data = [
    {id: "ceo", name: "Sarah Johnson", title: "CEO"},
    {id: "cto", parent: "ceo", name: "Michael Chen", title: "CTO"},
    {id: "cfo", parent: "ceo", name: "Emily Davis", title: "CFO"},
    {id: "coo", parent: "ceo", name: "Robert Wilson", title: "COO"},
    {id: "eng", parent: "cto", name: "David Kim", title: "Head of Engineering"},
    {id: "prod", parent: "cto", name: "Lisa Zhang", title: "Head of Product"},
    {id: "acct", parent: "cfo", name: "Diana Ross", title: "Head of Accounting"},
    {id: "ops", parent: "coo", name: "Peter Jackson", title: "Head of Operations"},
    {id: "fe", parent: "eng", name: "Anna Lee", title: "Frontend Lead"},
    {id: "be", parent: "eng", name: "Tom Harris", title: "Backend Lead"}
  ];

  // create an org chart and set the data
  chart = anychart.orgChart(data, "as-table");
  // set the chart title
  chart.title("Org Chart: Zoom and Pan");

  // mouse-wheel zoom and drag-to-pan are enabled by default;
  // this is how to turn them off:
  // chart.interactivity().zoomOnMouseWheel(false);
  // chart.interactivity().drag(false);

  // let the tree zoom out to 0.7 of its fitted size and in to 4x
  chart.minZoom(0.7);
  chart.maxZoom(4);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();

  // zoom in programmatically
  chart.zoomIn();
  showZoom();

  // keep the zoom readout current after wheel zoom
  document.getElementById("container").addEventListener("wheel", showZoom, {passive: true});
});

// read the current zoom
function showZoom() {
  var zoom = chart.getZoomLevel();
  document.getElementById("zoomLevel").value = zoom.toFixed(2);
}

// zoom the tree in by one step
function zoomInStep() {
  chart.zoomIn();
  showZoom();
}

// zoom the tree out by one step
function zoomOutStep() {
  chart.zoomOut();
  showZoom();
}

// reset the zoom and pan and fit the whole tree into the container
function fitTree() {
  chart.fit();
  showZoom();
}

// keep the tree inside the chart area (the default)
function boundsContain() {
  chart.interactivity().boundsMode("contain");
}

// let the tree be dragged anywhere
function boundsFree() {
  chart.interactivity().boundsMode("free");
}

// slide the tree back to the center once it is dragged fully out of view
function boundsAutoCenter() {
  chart.interactivity().boundsMode("auto-center");
}
</script>
</body>
</html>
