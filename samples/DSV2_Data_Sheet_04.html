<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <button id="expand">Open every row</button>
    <button id="collapse">Close every row</button>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // tree data: a parent row holds its children in a children array
  var data = [
    {product: "Tech", category: "Tech", units: 332, price: 1580, children: [
      {product: "Laptop", category: "Tech", units: 34, price: 1200},
      {product: "Monitor", category: "Tech", units: 58, price: 300},
      {product: "Keyboard", category: "Tech", units: 240, price: 80}
    ]},
    {product: "Office", category: "Office", units: 140, price: 645, children: [
      {product: "Chair", category: "Office", units: 120, price: 150},
      {product: "Desk", category: "Office", units: 12, price: 450},
      {product: "Lamp", category: "Office", units: 8, price: 45}
    ]}
  ];

  // create a data sheet
  var chart = anychart.dataSheet(data);

  // declare the columns, so that the children field does not become a column
  chart.column(0, {field: "product", title: "Product", width: 220});
  chart.column(1, {field: "units", title: "Units", width: 120, dataType: "number"});
  chart.column(2, {field: "price", title: "Price", width: 140, dataType: "number"});

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();

  // open every node of the tree
  document.getElementById("expand").onclick = function () {
    chart.hierarchy().expandAll();
  };

  // close every node of the tree
  document.getElementById("collapse").onclick = function () {
    chart.hierarchy().collapseAll();
  };
});
</script>
</body>
</html>
