<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var data = [
    {from: "Asia", to: "Europe", weight: 42},
    {from: "Asia", to: "N. America", weight: 51},
    {from: "Asia", to: "Oceania", weight: 18},
    {from: "Africa", to: "Europe", weight: 38},
    {from: "Africa", to: "N. America", weight: 9},
    {from: "S. America", to: "N. America", weight: 44},
    {from: "S. America", to: "Europe", weight: 16},
    {from: "Europe", to: "N. America", weight: 33},
    {from: "N. America", to: "Oceania", weight: 7},
    {from: "Oceania", to: "Asia", weight: 6}
  ];

  var chart = anychart.arcDiagram(data);
  chart.title("Arc Diagram: Vertical Orientation");

  // place the nodes in a column; the arcs curve to the right
  chart.orientation("vertical");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
