<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Org Chart 16"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-org.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: the type field picks the card layout of each item
  var data = [
    {id: "ceo", type: "person", name: "Sarah Johnson", position: "CEO", email: "sarah.johnson@example.com", status: "Office"},
    {id: "tech", parent: "ceo", type: "department", name: "Technology", head: "Michael Chen", headcount: 48, budget: "$6.2M"},
    {id: "fin", parent: "ceo", type: "department", name: "Finance", head: "Emily Davis", headcount: 12, budget: "$1.4M"},
    {id: "eng", parent: "tech", type: "person", name: "David Kim", position: "Head of Engineering", email: "david.kim@example.com", status: "Remote"},
    {id: "prod", parent: "tech", type: "person", name: "Lisa Zhang", position: "Head of Product", email: "lisa.zhang@example.com", status: "Office"},
    {id: "bot", parent: "fin", type: "agent", name: "Invoice Assistant", owner: "Diana Ross", kind: "AI"}
  ];

  // create an org chart and set the data
  var chart = anychart.orgChart(data, "as-table");
  // set the chart title
  chart.title("Org Chart: Node Types");

  // give the department cards their own fill
  chart.nodeTypes({
    department: {fill: "#f1f8e9"}
  });

  // widen the cards to fit the email addresses
  chart.nodeWidth(190);

  // add the zoom control
  var zoomController = anychart.ui.zoom();
  zoomController.target(chart);
  zoomController.render();

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
