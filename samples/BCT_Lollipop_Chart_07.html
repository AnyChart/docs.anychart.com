<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    {x: "January", value: 10000, plan: 9000},
    {x: "February", value: 12000, plan: 12500},
    {x: "March", value: 18000, plan: 15000},
    {x: "April", value: 11000, plan: 12000},
    {x: "May", value: 9000, plan: 9500}
  ];

  // create a lollipop chart
  var chart = anychart.lollipop();

  // set the chart title
  chart.title("Lollipop Chart: Labels on Both Sides of the Head");

  // create a lollipop series and set the data
  var series = chart.lollipop(data);
  // draw two labels for every point
  series.labels().enabled(true);
  series.labels().position("rangeMode");
  // show the value above the head and the plan below it
  series.labels().format(function () {
    if (this["rangeSide"] == "low") {
      return "plan " + this.getData("plan");
    }
    return this["value"];
  });
  // set the font color of the labels above the heads
  series.normal().highLabels({fontColor: "#d84315"});
  // set the font color of the labels below the heads
  series.normal().lowLabels({fontColor: "#1565c0"});

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
