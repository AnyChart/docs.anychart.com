<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 15"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Selection mode:</span>
    <label><input type="radio" name="mode" onclick="setModeSingle()" checked> single</label>
    <label><input type="radio" name="mode" onclick="setModeMulti()"> multi</label>
    <label><input type="radio" name="mode" onclick="setModeCheckbox()"> checkbox</label>
    <button onclick="selectFromCode()">Select rows from code</button>
    <output id="out">nothing selected</output>
</div>
<div id="container"></div>
<script>
var chart;
var out;

anychart.onDocumentReady(function () {

  // the data
  var data = [
    {product: 'Laptop',   category: 'Tech',   price: 1200, units: 34,  inStock: true},
    {product: 'Chair',    category: 'Office', price: 150,  units: 120, inStock: true},
    {product: 'Monitor',  category: 'Tech',   price: 300,  units: 58,  inStock: true},
    {product: 'Desk',     category: 'Office', price: 450,  units: 21,  inStock: true},
    {product: 'Keyboard', category: 'Tech',   price: 80,   units: 240, inStock: true},
    {product: 'Lamp',     category: 'Office', price: 45,   units: 0,   inStock: false},
    {product: 'Headset',  category: 'Tech',   price: 220,  units: 96,  inStock: true},
    {product: 'Cabinet',  category: 'Office', price: 380,  units: 12,  inStock: true}
  ];

  // create a data sheet
  chart = anychart.dataSheet(data);

  // declare the columns
  chart.column(0, {field: 'product',  title: 'Product',  width: 150});
  chart.column(1, {field: 'category', title: 'Category', width: 120});
  chart.column(2, {field: 'price',    title: 'Price',    width: 110, dataType: 'number'});
  chart.column(3, {field: 'units',    title: 'Units',    width: 110, dataType: 'number'});

  // set the color of a selected row
  chart.rowSelectedFill('#ffe082');

  // rowSelect fires when the user picks a row
  out = document.getElementById('out');
  chart.listen('rowSelect', function (e) {
    out.value = 'dataIndex ' + e.dataIndex + ', selected [' + e.selectedIndices + ']';
  });

  // set the container id
  chart.container('container');
  // initiate drawing the data sheet
  chart.draw();
});

// a click replaces the selection, a click on the selected row clears it
function setModeSingle() {
  chart.selection().mode('single');
}

// a plain click replaces, Ctrl-click toggles one row
function setModeMulti() {
  chart.selection().mode('multi');
}

// a leading checkbox column, every click on a row toggles it
function setModeCheckbox() {
  chart.selection().mode('checkbox');
}

// the indices are data indices; this fires no rowSelect, so write the output here
function selectFromCode() {
  chart.selection().selectedIndices([0, 2, 4]);
  out.value = 'selected from code [' + chart.selection().selectedIndices() + ']';
}
</script>
</body>
</html>
