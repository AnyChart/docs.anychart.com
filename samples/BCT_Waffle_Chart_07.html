<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-waffle.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data - the values do not need to sum to 100
  var data = [
    {name: "In-store", value: 1240},
    {name: "Online", value: 890},
    {name: "Wholesale", value: 470},
    {name: "Other", value: 260}
  ];

  // create a waffle chart and set the data
  var chart = anychart.waffle(data);
  // set the chart title
  chart.title("Waffle Chart: Tooltip");

  // customize the tooltip title and text
  chart.tooltip().titleFormat("Channel: {%name}");
  chart.tooltip().format("{%value} orders - {%percent}{decimalsCount:1}% of the total");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
