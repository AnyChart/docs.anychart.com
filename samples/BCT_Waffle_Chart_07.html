<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns of a data set (two fields: name, value)
  var dataSet = anychart.data.set([
    ["In-store", 43],["Online", 31],["Wholesale", 17],["Other", 9]
  ]);
  var mapping = dataSet.mapAs({name: 0, value: 1});

  var chart = anychart.waffle(mapping);
  chart.title("Waffle Chart: Data via data.set");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
