<!DOCTYPE html>
<html>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>

    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // set the data
  table = anychart.data.table();
  table.addData([
['2024-01-05', 5.8, 7.9, 6.2, 7.4],
['2024-02-05', 4.6, 6.1, 4.6, 6.1],
['2024-03-04', 5.9, 8.1, 4.9, 6.3],
['2024-04-04', 7.8, 10.7, 6.0, 9.5],
['2024-05-04', 10.5, 13.7, 8.5, 10.2],
['2024-06-04', 13.8, 17, 9.7, 13.5],
['2024-07-04', 16.5, 18.5, 12.7, 14.3],
['2024-09-03', 17.8, 19, 12.9, 14.1],
['2024-09-04', 15.4, 17.8, 12.2, 13.1],
['2024-10-04', 12.7, 15.3, 11.3, 12.7],
['2024-11-04', 9.8, 13, 8.4, 12.1],
['2024-12-04', 9, 10.1, 7.4, 8.6],
['2024-01-05', 5.7, 8, 7.0, 7.8],
['2025-02-04', 6, 8.4, 6.8, 8.1],
['2025-03-04', 6, 9.5, 7.0, 8.8],
['2025-04-04', 7.7, 10, 7.1, 9.3],
['2025-05-04', 8.9, 11.1, 8.6, 10.3],
['2025-06-04', 10.2, 16.3, 9.1, 12.9],
['2025-07-04', 14.3, 19, 11.2, 15.4],
['2025-08-04', 16, 20.1, 12.5, 14.8],
['2025-09-04', 15.8, 18.9, 11.4, 12.9],
['2025-10-04', 11.4, 13.2, 9.3, 12.4],
['2025-11-04', 8.3, 10, 8.5, 9.5],
['2025-12-04', 6.5, 8.7, 6.1, 8],
['2026-01-04', 7.2, 8.6, 6, 7.5],
['2026-02-04', 5.3, 7.4, 6.2, 8.2],
['2026-03-05', 6.1, 9.4, 7.3, 9.1],
['2026-04-05', 8.7, 11.2, 9, 11.3],        
['2026-05-25', 10.4, 14.3, 10.8, 13.8],
['2026-06-26', 13.5, 17.1, 12.1, 15.6],
['2026-07-27', 15.8, 19.7, 13.5, 15.5],
['2026-08-28', 17.8, 21, 12.3, 14.9],
['2026-09-29', 15.1, 17.3, 10.8, 12.6],
['2026-10-30', 12.6, 15.9, 9.7, 10.5],
['2026-12-01', 10.2, 13.8, 7.9, 9.1],
['2027-01-01', 8.3, 9.6, 6.3, 7.5]
  ]);
  
  // map the data
  mapping_lon = table.mapAs();
  mapping_lon.addField('low', 1);
  mapping_lon.addField('high', 2);
  mapping_edb = table.mapAs();
  mapping_edb.addField('low', 3);
  mapping_edb.addField('high', 4);

  // chart type
  var chart = anychart.stock();

  // set the series for London
  var series_lon = chart.plot(0).rangeColumn(mapping_lon);
  series_lon.name("Water temperature in London in 2010-2012");

  // set the series for Edinburgh
  var series_edb = chart.plot(1).rangeColumn(mapping_edb);
  series_edb.name("Water temperature in Edinburgh in 2010-2012");

  // australia series coloring
  series_lon.fill("#CC9933");
  series_lon.stroke("#663300");

  // sydney series coloring
  series_edb.fill("#fff");
  series_edb.hatchFill("cross");
  series_edb.stroke("#000");

  chart.title('Water Temperature');
  chart.container('container');

  chart.draw();
});
</script>
</body>
</html>
