<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 13"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // the data
  var data = [
    {id: 1, product: 'Laptop',   category: 'Tech',   price: 1200, stock: 34,  supplier: 'Northwind'},
    {id: 2, product: 'Chair',    category: 'Office', price: 150,  stock: 120, supplier: 'Contoso'},
    {id: 3, product: 'Monitor',  category: 'Tech',   price: 300,  stock: 58,  supplier: 'Northwind'},
    {id: 4, product: 'Desk',     category: 'Office', price: 450,  stock: 21,  supplier: 'Fabrikam'},
    {id: 5, product: 'Keyboard', category: 'Tech',   price: 80,   stock: 240, supplier: 'Contoso'},
    {id: 6, product: 'Lamp',     category: 'Office', price: 45,   stock: 175, supplier: 'Fabrikam'},
    {id: 7, product: 'Headset',  category: 'Tech',   price: 220,  stock: 96,  supplier: 'Northwind'},
    {id: 8, product: 'Cabinet',  category: 'Office', price: 380,  stock: 12,  supplier: 'Contoso'}
  ];

  // add a button bar above the grid and a panel below it
  var container = document.getElementById('container');
  var bar = document.createElement('div');
  bar.style.cssText = 'height:40px;padding:8px;box-sizing:border-box;font:13px Arial,sans-serif';
  bar.innerHTML = '<button id="undo">Undo last edit</button> ' +
                  '<span>double-click a Product or Price cell to edit it</span>';
  document.body.insertBefore(bar, container);

  var panel = document.createElement('div');
  panel.id = 'panel';
  panel.style.cssText = 'height:70px;padding:8px;box-sizing:border-box;overflow:auto;' +
                        'font:12px Consolas,monospace';
  document.body.appendChild(panel);
  container.style.height = 'calc(100% - 110px)';

  // create a data sheet
  var chart = anychart.dataSheet(data);

  // editing needs TWO switches: editable on the column, and cellEditor().enabled() on the grid
  chart.column(0, {field: 'product',  title: 'Product',  width: 150, editable: true});
  chart.column(1, {field: 'category', title: 'Category', width: 120});
  chart.column(2, {field: 'price',    title: 'Price',    width: 110, dataType: 'number', editable: true});
  chart.column(3, {field: 'stock',    title: 'Units',    width: 110, dataType: 'number'});

  // a validator must be set as a method call - the column config object ignores it
  chart.column(2).validator(function (value, rowData) {
    if (value <= 0) {
      return 'The price of ' + rowData.product + ' must be above 0';
    }
    return true;
  });

  chart.cellEditor().enabled(true);

  // the edits are written into the row objects you passed to data()
  var panelEl = document.getElementById('panel');
  function showData() {
    var parts = [];
    for (var i = 0; i < data.length; i++) {
      parts.push(data[i].product + ' = ' + data[i].price);
    }
    panelEl.innerHTML = 'your array: ' + parts.join(' | ');
  }

  // celleditend fires just BEFORE the new value is written,
  // so read your array on the next tick
  chart.listen('celleditend', function () {
    setTimeout(showData, 0);
  });

  // undo() reverts the last committed change and redraws by itself
  document.getElementById('undo').onclick = function () {
    chart.cellEditor().undo();
    showData();
  };

  // set the container id and draw
  chart.container('container');
  chart.draw();

  showData();

});
</script>
</body>
</html>
