<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 13"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Shape:</span>
    <label><input type="radio" name="shape" id="shapeCircle" onclick="changeShape('circle')"> circle</label>
    <label><input type="radio" name="shape" id="shapeRectangle" onclick="changeShape('rectangle')" checked> rectangle</label>
    <label>Node height
        <input type="range" min="4" max="40" step="2" value="20" oninput="changeHeight(this.value)">
        <output id="heightValue">20</output>
    </label>
    <span>Size from weight:</span>
    <label><input type="radio" name="weighted" id="weightedOn" onclick="changeWeightedNodes(true)" checked> yes</label>
    <label><input type="radio" name="weighted" id="weightedOff" onclick="changeWeightedNodes(false)"> no</label>
    <label>Smallest
        <input type="range" min="2" max="20" step="2" value="6" oninput="changeMinNodeSize(this.value)">
        <output id="minNodeSizeValue">6</output>
    </label>
    <label>Largest
        <input type="range" min="6" max="20" step="2" value="20" oninput="changeMaxNodeSize(this.value)">
        <output id="maxNodeSizeValue">20</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: requests between the departments of a company
  var data = [
    {from: "Sales", to: "Marketing", weight: 9},
    {from: "Sales", to: "Finance", weight: 16},
    {from: "Finance", to: "HR", weight: 5},
    {from: "Support", to: "Sales", weight: 14},
    {from: "Support", to: "Marketing", weight: 6},
    {from: "Marketing", to: "HR", weight: 3}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title
  chart.title("Arc Diagram: Node Shape");

  // draw the nodes as rectangles and set their size across the node line
  chart.node().shape("rectangle");
  chart.node().height(20);

  // keep the weighted sizes between the two bounds
  chart.minNodeSize(6);
  chart.maxNodeSize(20);

  // give one node a size of its own
  chart.node("HR").width(24);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// apply the chosen shape: the chart redraws itself
function changeShape(value) {
  chart.node().shape(value);
}

// set the size of the nodes across the node line
function changeHeight(value) {
  chart.node().height(value);
  document.getElementById("heightValue").value = value;
}

// take the size of a node from its weight, or give every node the same size
function changeWeightedNodes(value) {
  chart.weightedNodes(value);
}

// set the smallest size a weighted node can take
function changeMinNodeSize(value) {
  chart.minNodeSize(value);
  document.getElementById("minNodeSizeValue").value = value;
}

// set the largest size a weighted node can take
function changeMaxNodeSize(value) {
  chart.maxNodeSize(value);
  document.getElementById("maxNodeSizeValue").value = value;
}
</script>
</body>
</html>
