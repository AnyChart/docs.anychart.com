<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Vertical Dumbbell Chart"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    ["Job A", 40000, 60000],
    ["Job B", 50000, 80000],
    ["Job C", 35000, 55000],
    ["Job D", 45000, 65000],
    ["Job E", 30000, 70000]
  ];

  // create a vertical chart
  var chart = anychart.vertical();

  // set the chart title
  chart.title("Vertical Dumbbell Chart");

  // create a dumbbell series and set the data
  var series = chart.dumbbell(data);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
