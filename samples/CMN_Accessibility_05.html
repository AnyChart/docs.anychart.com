<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="CMN Accessibility 05"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />
    
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label><input type="checkbox" onchange="highContrast(this.checked)"> High contrast</label>
</div>
<div id="container"></div>
<script>
var chart;

anychart.onDocumentReady(function () {
  createChart();
});

// switch the high-contrast mode and create the chart again
function highContrast(enabled) {
  if (enabled) {
    // the theme file is loaded on demand, so wait for the promise
    anychart.a11yHighContrast(true).then(createChart);
  } else {
    anychart.a11yHighContrast(false);
    createChart();
  }
}

function createChart() {
  // dispose of the previous chart: a chart keeps its colors until it is created again
  if (chart) chart.dispose();

  // data
  var data = anychart.data.set([
    ["John",  10000, 12000, 14000],
    ["Jake",  12000, 15000, 11000],
    ["Peter", 18000, 16000, 13000],
    ["James", 11000, 13000, 17000],
    ["Mary",  9000,  19000, 15000]
  ]);

  // create a column chart with three series
  chart = anychart.column();
  chart.column(data.mapAs({x: 0, value: 1})).name("Sales in 2013");
  chart.column(data.mapAs({x: 0, value: 2})).name("Sales in 2014");
  chart.column(data.mapAs({x: 0, value: 3})).name("Sales in 2015");

  // show the state of the high-contrast mode in the title
  chart.title("High-contrast mode: " + (anychart.a11yHighContrast() ? "on" : "off"));

  // enable the legend
  chart.legend(true);

  // set the container id and draw the chart
  chart.container("container");
  chart.draw();
}
</script>
</body>
</html>
