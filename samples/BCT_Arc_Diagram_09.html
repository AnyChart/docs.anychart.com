<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 09"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #controls output { display: inline-block; text-align: left; }
        #maxLinksValue { min-width: 3ch; }
        #renderedCount { min-width: 16ch; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Max links
        <input type="range" min="5" max="100" step="5" value="50" oninput="changeMaxLinks(this.value)">
        <output id="maxLinksValue">50</output>
    </label>
    <span>drawn: <output id="renderedCount"></output></span>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // generate data: 15 servers, every pair of them connected once (105 links), each link
  // with its own weight between 1 and 40; the weights are spread evenly, in a fixed order
  var serverName = function (k) {
    return "Server " + (k < 9 ? "0" : "") + (k + 1);
  };
  var data = [];
  var n = 0;
  for (var from = 0; from < 15; from++) {
    for (var to = from + 1; to < 15; to++) {
      data.push({from: serverName(from), to: serverName(to), weight: 1 + (n * 17) % 40});
      n++;
    }
  }

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title
  chart.title("Arc Diagram: Data Volume");

  // keep the servers in data order
  chart.sortOrder("none");

  // draw only the heaviest links
  chart.maxLinksRendered(50);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();

  showRendered();
});

// set the limit: the chart redraws itself
function changeMaxLinks(value) {
  chart.maxLinksRendered(value);
  document.getElementById("maxLinksValue").value = value;
  showRendered();
}

// read the result of the last drawing
function showRendered() {
  var n = chart.getRenderedLinksCount();
  var simplified = chart.isSimplified();
  document.getElementById("renderedCount").value = n + (simplified ? " (simplified)" : " (all)");
}
</script>
</body>
</html>
