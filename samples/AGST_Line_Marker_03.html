<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="AGST Line Marker 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />
    
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // data
  var data = [
    [Date.UTC(2025, 0, 03), 10000],
    [Date.UTC(2025, 1, 03), 12000],
    [Date.UTC(2025, 2, 03), 18000],
    [Date.UTC(2025, 3, 03), 11000],
    [Date.UTC(2025, 4, 03), 9000],
    [Date.UTC(2025, 5, 03), 12000],
    [Date.UTC(2025, 6, 03), 15000],
    [Date.UTC(2025, 7, 03), 16000],
    [Date.UTC(2025, 8, 03), 13000],
    [Date.UTC(2025, 9, 03), 19000],
    [Date.UTC(2025, 10, 03), 12000],
    [Date.UTC(2025, 11, 03), 14000],
    [Date.UTC(2026, 0, 2), 13000]
  ];

  // chart type
  var chart = anychart.line();

  chart.xScale(anychart.scales.dateTime());

  chart.xScale().minimum(Date.UTC(2025, 0, 2));
  chart.xScale().maximum(Date.UTC(2026, 0, 03));

  chart.yScale().minimum(0);

  // y axis title
  chart.yAxis().title("Sales");

  // set lowest line marker
  var lineMarker = chart.lineMarker();
  lineMarker.value(9000);
  lineMarker.axis(chart.yAxis());

  // divide plot on seasons
  var seasonMarker_1 = chart.lineMarker();
  seasonMarker_1.value(Date.UTC(2025, 2, 03));
  seasonMarker_1.axis(chart.xAxis());
  var seasonMarker_2 = chart.lineMarker();
  seasonMarker_2.value(Date.UTC(2025, 5, 03));
  seasonMarker_2.axis(chart.xAxis());
  var seasonMarker_3 = chart.lineMarker();
  seasonMarker_3.value(Date.UTC(2025, 8, 03));
  seasonMarker_3.axis(chart.xAxis());
  var seasonMarker_4 = chart.lineMarker();
  seasonMarker_4.value(Date.UTC(2025, 11, 03));
  seasonMarker_4.axis(chart.xAxis());

  chart.line(data);
  // draw
  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
