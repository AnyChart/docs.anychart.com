<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 14"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Link thickness:</span>
    <label><input type="radio" name="thickness" id="thicknessFixed" onclick="changeThickness('fixed')" checked> the same for every link</label>
    <label><input type="radio" name="thickness" id="thicknessWeight" onclick="changeThickness('weight')"> from the weight</label>
    <label><input type="radio" name="thickness" id="thicknessFormula" onclick="changeThickness('formula')"> from a formula</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: requests between the departments of a company
  var data = [
    {from: "Sales", to: "Marketing", weight: 9},
    {from: "Sales", to: "Finance", weight: 16},
    {from: "Finance", to: "HR", weight: 5},
    {from: "Support", to: "Sales", weight: 14},
    {from: "Support", to: "Marketing", weight: 6},
    {from: "Marketing", to: "HR", weight: 3}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title
  chart.title("Arc Diagram: Link Thickness");

  // the same thickness for every link, thicker under the pointer and when selected
  chart.link().normal().thickness(2);
  chart.link().hovered().thickness(6);
  chart.link().selected().thickness(4);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// a thickness of its own for every link, from its weight
function thicknessFromWeight() {
  return this.value / 4;
}

// the thickness of a link in the normal state: a number, a formula, or the weight
var thicknessModes = {"fixed": 2, "weight": null, "formula": thicknessFromWeight};

// apply the chosen thickness: the chart redraws itself
function changeThickness(value) {
  chart.link().normal().thickness(thicknessModes[value]);
}
</script>
</body>
</html>
