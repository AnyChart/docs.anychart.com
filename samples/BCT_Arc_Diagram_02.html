<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns of a data set (four fields: from, to, weight, group)
  var dataSet = anychart.data.set([
    ["Asia", "Europe", 42, "Eurasia"],
    ["Asia", "N. America", 51, "Eurasia"],
    ["Asia", "Oceania", 18, "Eurasia"],
    ["Africa", "Europe", 38, "Africa-Europe"],
    ["Africa", "N. America", 9, "Africa-Europe"],
    ["S. America", "N. America", 44, "Americas"],
    ["S. America", "Europe", 16, "Americas"],
    ["Europe", "N. America", 33, "Americas"],
    ["N. America", "Oceania", 7, "Americas"],
    ["Oceania", "Asia", 6, "Eurasia"]
  ]);
  var mapping = dataSet.mapAs({from: 0, to: 1, weight: 2, group: 3});

  var chart = anychart.arcDiagram(mapping);
  chart.title("Arc Diagram: Data via data.set");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
