<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content=""/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-gantt.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4" type="text/javascript"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />
    
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // create data
    var data = [
      {
        id: "1",
        name: "Resource",
        periods: [
          {id:"1_1", start: "2026-01-09", end: "2026-01-29"},
          {id:"1_2", start: "2026-02-01", end: "2026-02-26",
           connectTo: "2_1", connectorType: "start-finish"},
          {id:"1_3", start: "2026-03-05", end: "2026-03-29",
           connectTo: "2_2", connectorType: "start-start"}
      ]},
      {
        id: "2",
        name: "Resource",
        periods: [
          {id: "2_1", start: "2026-01-11", end: "2026-02-19"},
          {id: "2_2", start: "2026-03-09", end: "2026-03-22",
           connectTo: "3_2", connectorType: "finish-finish"}
      ]},
      {
        id: "3",
        name: "Resource",
        periods: [
          {id: "3_1", start: "2026-01-08", end: "2026-02-24",
           connectTo: "3_2", connectorType: "finish-start"},
          {id: "3_2", start: "2026-03-05", end: "2026-03-24"}
      ]}
    ];

    // create a data tree
    var treeData = anychart.data.tree(data, "as-table");

    // create a chart
    var chart = anychart.ganttResource(); 
    
    // set the data
    chart.data(treeData);  

    // configure connectors
    var connectors = chart.getTimeline().connectors();
    connectors.normal().fill("#ffa000");
    connectors.selected().fill("#ef6c00");
    connectors.normal().stroke("2 #ffa000");
    connectors.selected().stroke("2 #ef6c00");

    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();

    // fit elements to the width of the timeline
    chart.fitAll();
});
</script>
</body>
</html>
