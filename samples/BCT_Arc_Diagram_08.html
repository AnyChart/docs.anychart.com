<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 08"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Layout:</span>
    <label><input type="radio" name="layout" id="layoutHorizontalUp" onclick="setLayout('horizontal', 'up')"> horizontal (up)</label>
    <label><input type="radio" name="layout" id="layoutHorizontalDown" onclick="setLayout('horizontal', 'down')"> horizontal (down)</label>
    <label><input type="radio" name="layout" id="layoutVerticalLeft" onclick="setLayout('vertical', 'left')"> vertical (left)</label>
    <label><input type="radio" name="layout" id="layoutVerticalRight" onclick="setLayout('vertical', 'right')" checked> vertical (right)</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: requests between the departments of a company
  var data = [
    {from: "Sales", to: "Marketing", weight: 9},
    {from: "Sales", to: "Finance", weight: 16},
    {from: "Finance", to: "HR", weight: 5},
    {from: "Support", to: "Sales", weight: 14},
    {from: "Support", to: "Marketing", weight: 6},
    {from: "Marketing", to: "HR", weight: 3}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title and separate it from the diagram
  chart.title("Arc Diagram: Orientation");
  chart.title().padding(0, 0, 20, 0);

  // give the nodes room: wider bars and more spacing between them
  chart.nodeWidth(30);
  chart.nodeSpacing(90);

  // place the nodes in a column; the links curve to the right
  chart.orientation("vertical");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// apply the chosen layout: the chart redraws itself
function setLayout(orientation, direction) {
  chart.orientation(orientation);
  chart.arcDirection(direction);
}
</script>
</body>
</html>
