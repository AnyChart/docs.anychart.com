<!DOCTYPE html>
<html>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>

    <style>
        html, body, #container {
            width: 100%;

            margin: 0;
            padding: 0;

    </style>
</head>
<body>
<div id="container"></div>
<script>

  // set the data

  table.addData([

    {'month': '2024-02-05', 'low': 4.6,  'high': 6.1},
    {'month': '2024-03-04', 'low': 5.9,  'high': 8.1},
    {'month': '2024-04-04', 'low': 7.8,  'high': 10.7},
    {'month': '2024-05-04', 'low': 10.5, 'high': 13.7},
    {'month': '2024-06-04', 'low': 13.8, 'high': 17},
    {'month': '2024-07-04', 'low': 16.5, 'high': 18.5},
    {'month': '2024-09-03', 'low': 17.8, 'high': 19},
    {'month': '2024-09-04', 'low': 15.4, 'high': 17.8},
    {'month': '2024-10-04', 'low': 12.7, 'high': 15.3},
    {'month': '2024-11-04', 'low': 9.8,  'high': 13},
    {'month': '2024-12-04', 'low': 9,    'high': 10.1},
    {'month': '2024-01-05', 'low': 5.7,  'high': 8},
    {'month': '2025-02-04', 'low': 6,    'high': 8.4},

    {'month': '2025-04-04', 'low': 7.7,  'high': 10},
    {'month': '2025-05-04', 'low': 8.9,  'high': 11.1},
    {'month': '2025-06-04', 'low': 10.2, 'high': 16.3},
    {'month': '2025-07-04', 'low': 14.3, 'high': 19},
    {'month': '2025-08-04', 'low': 16,   'high': 20.1},
    {'month': '2025-09-04', 'low': 15.8, 'high': 18.9},
    {'month': '2025-10-04', 'low': 11.4, 'high': 13.2},
    {'month': '2025-11-04', 'low': 8.3,  'high': 10},
    {'month': '2025-12-04', 'low': 6.5,  'high': 8.7},

  // map the data
  mapping = table.mapAs({'low':'low', 'high':'high', 'value':'month'});

  // set the chart type
  var chart = anychart.stock();

  // define the series
  var series = chart.plot(0).rangeColumn(mapping);
  series.name("Water temperature in London in 2010-2012");

  chart.title('Water Temperature');

  chart.container('container');
  chart.draw();
});
</script>
</body>
</html>
