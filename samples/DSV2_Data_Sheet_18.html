<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 18"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Tick the rows, then use the buttons; the paste lands at the cell you clicked last:</span>
    <button onclick="copySelection()">Copy</button>
    <button onclick="cutSelection()">Cut</button>
    <button onclick="pasteAtCursor()">Paste</button>
    <span>Column titles:</span>
    <label><input type="radio" name="headers" onclick="headersOff()" checked> off</label>
    <label><input type="radio" name="headers" onclick="headersOn()"> on</label>
    <output id="out"></output>
</div>
<div id="container"></div>
<script>
var chart;
var out;

anychart.onDocumentReady(function () {

  // the data
  var data = [
    {product: 'Laptop',   category: 'Tech',   price: 1200, units: 34,  inStock: true},
    {product: 'Chair',    category: 'Office', price: 150,  units: 120, inStock: true},
    {product: 'Monitor',  category: 'Tech',   price: 300,  units: 58,  inStock: true},
    {product: 'Desk',     category: 'Office', price: 450,  units: 21,  inStock: true},
    {product: 'Keyboard', category: 'Tech',   price: 80,   units: 240, inStock: true},
    {product: 'Lamp',     category: 'Office', price: 45,   units: 0,   inStock: false},
    {product: 'Headset',  category: 'Tech',   price: 220,  units: 96,  inStock: true},
    {product: 'Cabinet',  category: 'Office', price: 380,  units: 12,  inStock: true}
  ];

  // create a data sheet
  chart = anychart.dataSheet(data);

  // cut and paste write into the editable columns only
  chart.column(0, {field: 'product',  title: 'Product',  width: 150, editable: true});
  chart.column(1, {field: 'category', title: 'Category', width: 120, editable: true});
  chart.column(2, {field: 'price',    title: 'Price',    width: 110, dataType: 'number', editable: true});
  chart.column(3, {field: 'units',    title: 'Units',    width: 110, dataType: 'number'});

  // let the user tick the rows the clipboard acts on
  chart.selection().mode('checkbox');

  // copy and cut act on the selected rows
  chart.selection().selectedIndices([0, 2]);

  // keep the preview in step with the user's ticks
  out = document.getElementById('out');
  chart.listen('rowSelect', showTSV);

  // set the container id
  chart.container('container');
  // initiate drawing the data sheet
  chart.draw();

  showTSV();
});

// buildTSV() returns what copy() writes, without touching the clipboard
function showTSV() {
  out.value = chart.clipboard().buildTSV();
}

// write the selected rows to the system clipboard
function copySelection() {
  chart.clipboard().copy();
}

// copy the selected rows, then clear their editable cells
function cutSelection() {
  chart.clipboard().cut();
  showTSV();
}

// fill the editable cells from the clipboard, starting at the cell last clicked
function pasteAtCursor() {
  chart.clipboard().paste();
}

// add the column titles as the first line
function headersOn() {
  chart.clipboard().includeHeaders(true);
  showTSV();
}

// the column titles are off by default
function headersOff() {
  chart.clipboard().includeHeaders(false);
  showTSV();
}
</script>
</body>
</html>
