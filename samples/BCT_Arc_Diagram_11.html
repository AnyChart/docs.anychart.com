<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 11"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Node span
        <input type="range" min="30" max="100" step="5" value="85" oninput="changeNodesSpan(this.value)">
        <output id="nodesSpanValue">85%</output>
    </label>
    <label>Node width
        <input type="range" min="4" max="50" step="1" value="30" oninput="changeNodeWidth(this.value)">
        <output id="nodeWidthValue">30</output>
    </label>
    <label>Curvature
        <input type="range" min="0.2" max="1.2" step="0.05" value="0.8" oninput="changeCurvature(this.value)">
        <output id="curvatureValue">0.8</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: requests between the departments of a company
  var data = [
    {from: "Sales", to: "Marketing", weight: 9},
    {from: "Sales", to: "Finance", weight: 16},
    {from: "Finance", to: "HR", weight: 5},
    {from: "Support", to: "Sales", weight: 14},
    {from: "Support", to: "Marketing", weight: 6},
    {from: "Marketing", to: "HR", weight: 3}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title
  chart.title("Arc Diagram: Geometry");

  // give the row of nodes most of the node line and make the bars thicker
  chart.nodesSpan("85%");
  chart.nodeWidth(30);

  // set the height of the links and curve them below the node line
  chart.curvature(0.8);
  chart.reverseArcs(true);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// spread the nodes over more or less of the node line: the chart redraws itself
function changeNodesSpan(value) {
  chart.nodesSpan(value + "%");
  document.getElementById("nodesSpanValue").value = value + "%";
}

// resize the node bars: the chart redraws itself
function changeNodeWidth(value) {
  chart.nodeWidth(value);
  document.getElementById("nodeWidthValue").value = value;
}

// change the height of the links: the chart redraws itself
function changeCurvature(value) {
  chart.curvature(value);
  document.getElementById("curvatureValue").value = value;
}
</script>
</body>
</html>
