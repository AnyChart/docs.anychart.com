<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="CS Tooltip 08"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />
    
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // create a chart
  var chart = anychart.cartesian();

  chart.title("Complex Tooltip Title");

  // set series data
  var series = chart.line([
    [Date.UTC(2021, 0, 01), 72924],
    [Date.UTC(2021, 1, 01), 79371],
    [Date.UTC(2021, 2, 01), 76899],
    [Date.UTC(2021, 3, 01), 80891],
    [Date.UTC(2021, 4, 01), 50548],
    [Date.UTC(2021, 5, 01), 47039],
    [Date.UTC(2021, 6, 01), 64029],
    [Date.UTC(2021, 7, 01), 57180],
    [Date.UTC(2021, 8, 01), 69809],
    [Date.UTC(2021, 9, 01), 73899],
    [Date.UTC(2021, 10, 01), 59456],
    [Date.UTC(2021, 11, 01), 68822],
    [Date.UTC(2022, 0, 01), 92536],
    [Date.UTC(2022, 1, 01), 105108],
    [Date.UTC(2022, 2, 01), 97777],
    [Date.UTC(2022, 3, 01), 82511],
    [Date.UTC(2022, 4, 01), 123476],
    [Date.UTC(2022, 5, 01), 123113],
    [Date.UTC(2022, 6, 01), 104613],
    [Date.UTC(2022, 7, 01), 104919],
    [Date.UTC(2022, 8, 01), 109661],
    [Date.UTC(2022, 9, 01), 99281],
    [Date.UTC(2022, 10, 01), 104695],
    [Date.UTC(2022, 11, 01), 109492],
    [Date.UTC(2023, 0, 01), 148910],
    [Date.UTC(2023, 1, 01), 154197],
    [Date.UTC(2023, 2, 02), 122224],
    [Date.UTC(2023, 3, 02), 136687],
    [Date.UTC(2023, 4, 02), 173808],
    [Date.UTC(2023, 5, 02), 179910],
    [Date.UTC(2023, 6, 02), 194502],
    [Date.UTC(2023, 7, 02), 176565],
    [Date.UTC(2023, 8, 02), 152765],
    [Date.UTC(2023, 9, 02), 152950],
    [Date.UTC(2023, 10, 02), 161812],
    [Date.UTC(2023, 11, 02), 169217],
    [Date.UTC(2024, 0, 02), 168348],
    [Date.UTC(2024, 1, 02), 174274],
    [Date.UTC(2024, 2, 01), 206777],
    [Date.UTC(2024, 3, 01), 195678],
    [Date.UTC(2024, 4, 01), 201773],
    [Date.UTC(2024, 5, 01), 211041],
    [Date.UTC(2024, 6, 01), 203658],
    [Date.UTC(2024, 7, 01), 194100],
    [Date.UTC(2024, 8, 01), 197417],
    [Date.UTC(2024, 9, 01), 211506],
    [Date.UTC(2024, 10, 01), 211488],
    [Date.UTC(2024, 11, 01), 198981],
    [Date.UTC(2025, 0, 01), 232004],
    [Date.UTC(2025, 1, 01), 228394],
    [Date.UTC(2025, 2, 01), 204727],
    [Date.UTC(2025, 3, 01), 246861],
    [Date.UTC(2025, 4, 01), 249813],
    [Date.UTC(2025, 5, 01), 235604],
    [Date.UTC(2025, 6, 01), 255414],
    [Date.UTC(2025, 7, 01), 280067],
    [Date.UTC(2025, 8, 01), 282872],
    [Date.UTC(2025, 9, 01), 287978],
    [Date.UTC(2025, 10, 01), 295558],
    [Date.UTC(2025, 11, 01), 275614]
  ]);

  var tooltipTitle = series.tooltip().title();
  tooltipTitle.useHtml(true);
  tooltipTitle.hAlign("center");

  var tooltip = series.tooltip();
  tooltip.titleFormat(function() {
    var time = "";
    var date = new Date(this.x);
    switch (true){
      case (date.toLocaleDateString("en-US", {month: "numeric"})<4):
time = "first quarter";
break;
      case (date.toLocaleDateString("en-US", {month: "numeric"})<7):
time = "second quarter";
break;
      case (date.toLocaleDateString("en-US", {month: "numeric"})<10):
time = "third quarter";
break;
      case (date.toLocaleDateString("en-US", {month: "numeric"})<13):
time = "fourth quarter";
break;
    }
    return "Year: " + date.toLocaleDateString("en-US", {year: "numeric"}) + "<br><a style=\"font-size: 11; font-style: italic;\">"+time+"</a>";
  });
  tooltip.format(function() {
    return "Month: " + (new Date(this.x)).toLocaleDateString("en-US", {month: "long"}) + "\nIncome:$ " + this.value;
  });

  var xScale = anychart.scales.dateTime();
  chart.xScale(xScale);
  xScale.minimum(Date.UTC(2021, 0, 1));
  xScale.maximum(Date.UTC(2026, 0, 1));

  var xTicks = chart.xScale().ticks();
  xTicks.interval(0,4);

  var xLabels = chart.xAxis().labels();
  xLabels.format(function() {
    var date = new Date(this.tickValue);
    var options = {month: "short", year: "numeric"};
    return date.toLocaleDateString("en-US", options);
  });

  var yLabels = chart.yAxis().labels();
  yLabels.width(75);


  var interactivity = chart.interactivity();
  interactivity.hoverMode("by-x");
  interactivity.selectionMode("none");

  var crosshair = chart.crosshair();
  crosshair.enabled(true);
  crosshair.yStroke(false);
  crosshair.yLabel(false);

  var xLabel = crosshair.xLabel();
  xLabel.format(function() {
    var date = new Date(this.rawValue);
    var options = {month: "short", year: "numeric"};
    return date.toLocaleDateString("en-US", options);
  });

  series.markers(false);

  var hoverMarkers = series.hovered().markers();
  hoverMarkers.enabled(true);
  hoverMarkers.size(3);

  // draw chart
  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
