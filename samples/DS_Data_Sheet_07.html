<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  var products = [
    {sku: 101, product: 'Laptop Pro 15', category: 'Computers',   price: 1200, stock: 34,  status: 'In stock'},
    {sku: 102, product: 'Office Chair',  category: 'Furniture',   price: 150,  stock: 120, status: 'In stock'},
    {sku: 103, product: 'Monitor 27',    category: 'Computers',   price: 300,  stock: 58,  status: 'In stock'},
    {sku: 104, product: 'Desk Lamp',     category: 'Furniture',   price: 45,   stock: 210, status: 'In stock'},
    {sku: 105, product: 'Wireless Mouse',category: 'Accessories', price: 25,   stock: 430, status: 'Low stock'},
    {sku: 106, product: 'USB-C Hub',     category: 'Accessories', price: 60,   stock: 95,  status: 'In stock'},
    {sku: 107, product: 'Standing Desk', category: 'Furniture',   price: 890,  stock: 12,  status: 'Low stock'},
    {sku: 108, product: 'Webcam HD',     category: 'Accessories', price: 80,   stock: 0,   status: 'Out of stock'}
  ];

  var chart = anychart.dataSheet(products);

  // the columns are wider than the container, so the grid scrolls sideways
  // minWidth matters here: without it the row squeezes the columns to fit,
  // nothing scrolls sideways, and a pinned column has nothing to freeze against
  chart.column(0, {field: 'product',  title: 'Product',  width: 220, minWidth: 220, pinned: 'left'});
  chart.column(1, {field: 'category', title: 'Category', width: 170, minWidth: 170});
  chart.column(2, {field: 'price',    title: 'Price',    width: 160, minWidth: 160, dataType: 'number'});
  chart.column(3, {field: 'stock',    title: 'In Stock', width: 160, minWidth: 160, dataType: 'number'});
  chart.column(4, {field: 'sku',      title: 'SKU',      width: 160, minWidth: 160, dataType: 'number'});
  chart.column(5, {field: 'status',   title: 'Status',   width: 200, minWidth: 200, pinned: 'right'});

  chart.container('container');
  chart.draw();

  // move SKU from position 4 to position 1
  // pinned columns are never moved, so Product stays first and Status stays last
  chart.reorderColumn(4, 1);
  chart.draw();
});
</script>
</body>
</html>
