<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dependency Wheel 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns of a data set (three fields: from, to, weight)
  var dataSet = anychart.data.set([
    ["Coal", "Grid", 38],
    ["Gas", "Grid", 46],
    ["Nuclear", "Grid", 22],
    ["Hydro", "Grid", 17],
    ["Solar", "Grid", 11],
    ["Coal", "Heat", 9],
    ["Gas", "Heat", 24],
    ["Grid", "Industry", 41],
    ["Grid", "Buildings", 52],
    ["Grid", "Transport", 19],
    ["Heat", "Industry", 18],
    ["Heat", "Buildings", 21]
  ]);
  var mapping = dataSet.mapAs({from: 0, to: 1, weight: 2});

  var chart = anychart.dependencyWheel(mapping);
  chart.title("Dependency Wheel: Data via data.set");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
