<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Org Chart 02"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-org-chart.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data as a tree: children are nested into their parents
  var data = [
    {name: "Sarah Johnson", title: "CEO", children: [
      {name: "Michael Chen", title: "CTO", children: [
        {name: "David Kim", title: "Head of Engineering"},
        {name: "Lisa Zhang", title: "Head of Product"}
      ]},
      {name: "Emily Davis", title: "CFO"},
      {name: "Robert Wilson", title: "COO"}
    ]}
  ];

  // create an org chart in the "as-tree" mode
  var chart = anychart.orgChart(data, "as-tree");

  // set the chart title
  chart.title("Org Chart: Data as a Tree");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
