<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 11"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Sort by
        <select id="firstField" onchange="applySort()">
            <option value="product">Product</option>
            <option value="category" selected>Category</option>
            <option value="price">Price</option>
            <option value="units">Units</option>
        </select>
    </label>
    <label><input type="radio" name="order" value="asc" onclick="applySort()" checked> ascending</label>
    <label><input type="radio" name="order" value="desc" onclick="applySort()"> descending</label>
    <label>Then by
        <select id="secondField" onchange="applySort()">
            <option value="">nothing</option>
            <option value="product">Product</option>
            <option value="price" selected>Price</option>
            <option value="units">Units</option>
        </select>
    </label>
    <button onclick="clearSort()">Clear sort</button>
    <output id="state"></output>
</div>
<div id="container"></div>
<script>
var chart;

anychart.onDocumentReady(function () {

  // the data
  var data = [
    {id: 1,  product: "Laptop",   category: "Tech",    price: 1200, units: 34,  supplier: "Northwind"},
    {id: 2,  product: "Chair",    category: "Office",  price: 150,  units: 120, supplier: "Contoso"},
    {id: 3,  product: "Monitor",  category: "Tech",    price: 300,  units: 58,  supplier: "Northwind"},
    {id: 4,  product: "Desk",     category: "Office",  price: 450,  units: 21,  supplier: "Fabrikam"},
    {id: 5,  product: "Keyboard", category: "Tech",    price: 80,   units: 240, supplier: "Contoso"},
    {id: 6,  product: "Lamp",     category: "Office",  price: 45,   units: 175, supplier: "Fabrikam"},
    {id: 7,  product: "Headset",  category: "Tech",    price: 220,  units: 96,  supplier: "Northwind"},
    {id: 8,  product: "Cabinet",  category: "Office",  price: 380,  units: 12,  supplier: "Contoso"},
    {id: 9,  product: "Shelf",    category: "Office",  price: 210,  units: 42,  supplier: "Fabrikam"},
    {id: 10, product: "Router",   category: "Tech",    price: 130,  units: 64,  supplier: "Contoso"},
    {id: 11, product: "Footrest", category: "Office",  price: 60,   units: 88,  supplier: "Northwind"},
    {id: 12, product: "Locker",   category: "Office",  price: 540,  units: 9,   supplier: "Fabrikam"}
  ];

  // create a data sheet
  chart = anychart.dataSheet(data);

  // declare the columns
  // a numeric column needs dataType, or it is sorted as text
  chart.column(0, {field: "product", title: "Product", width: 150});
  chart.column(1, {field: "category", title: "Category", width: 120});
  chart.column(2, {field: "price", title: "Price", width: 110, dataType: "number"});
  chart.column(3, {field: "units", title: "Units", width: 110, dataType: "number"});

  // order by category, then by price, highest first
  // this code sort holds the headers off: press Clear sort to make them respond
  chart.sorting().sortBy("category", "asc");
  chart.sorting().addSort("price", "desc");

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();

  showSorts();
});

// sortBy() sets the first level and clears the rest, addSort() appends the next
// these buttons and the header cycle are alternative routes: the header cycle takes over once Clear sort empties the stack
function applySort() {
  var order = document.querySelector("input[name=order]:checked").value;
  var second = document.getElementById("secondField").value;
  chart.sorting().sortBy(document.getElementById("firstField").value, order);
  if (second) chart.sorting().addSort(second, order);
  chart.draw();
  showSorts();
}

// clearSort() empties the stack and restores the original row order
function clearSort() {
  chart.sorting().clearSort();
  chart.draw();
  showSorts();
}

// getSorts() reports the code sort stack, not a header sort
function showSorts() {
  var sorts = chart.sorting().getSorts();
  var text = [];
  for (var i = 0; i < sorts.length; i++) {
    text.push(sorts[i].field + " " + sorts[i].order);
  }
  document.getElementById("state").value = text.join(", ") || "no code sort - click a header to sort";
}
</script>
</body>
</html>
