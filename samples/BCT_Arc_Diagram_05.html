<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 05"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-arc-diagram.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Node width
        <input type="range" min="4" max="60" step="1" value="28" oninput="changeNodeWidth(this.value)">
        <output id="nodeWidthValue">28</output>
    </label>
    <label>Node spacing
        <input type="range" min="0" max="90" step="1" value="45" oninput="changeNodeSpacing(this.value)">
        <output id="nodeSpacingValue">45</output>
    </label>
    <label>Curvature
        <input type="range" min="0.2" max="3" step="0.1" value="1.5" oninput="changeCurvature(this.value)">
        <output id="curvatureValue">1.5</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: migration flows between regions
  var data = [
    {from: "Asia", to: "Europe", weight: 42},
    {from: "Asia", to: "N. America", weight: 51},
    {from: "Asia", to: "Oceania", weight: 18},
    {from: "Africa", to: "Europe", weight: 38},
    {from: "Africa", to: "N. America", weight: 9},
    {from: "S. America", to: "N. America", weight: 44},
    {from: "S. America", to: "Europe", weight: 16},
    {from: "Europe", to: "N. America", weight: 33},
    {from: "N. America", to: "Oceania", weight: 7},
    {from: "Oceania", to: "Asia", weight: 6}
  ];

  // create an arc diagram and set the data
  chart = anychart.arcDiagram(data);
  // set the chart title and separate it from the diagram
  chart.title("Arc Diagram: Node and Arc Geometry");
  chart.title().padding(0, 0, 20, 0);

  // make the node bars bigger and spread them wider
  chart.nodeWidth(28);
  chart.nodeSpacing(45);

  // make the arcs taller and curve them below the node line
  chart.curvature(1.5);
  chart.arcDirection("down");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// resize the node bars: the chart redraws itself
function changeNodeWidth(value) {
  chart.nodeWidth(value);
  document.getElementById("nodeWidthValue").value = value;
}

// change the gap between the nodes: the chart redraws itself
function changeNodeSpacing(value) {
  chart.nodeSpacing(value);
  document.getElementById("nodeSpacingValue").value = value;
}

// change the height of the arcs: the chart redraws itself
function changeCurvature(value) {
  chart.curvature(value);
  document.getElementById("curvatureValue").value = value;
}
</script>
</body>
</html>
