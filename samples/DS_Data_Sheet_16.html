<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 16"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="readout"></div>
<div id="container"></div>
<script>

// build 5,000 rows
var names = ["Laptop", "Chair", "Monitor", "Desk", "Keyboard", "Lamp", "Headset", "Cabinet", "Shelf", "Webcam"];
var categories = ["Tech", "Office", "Storage"];
var rows = [];
for (var i = 1; i <= 5000; i++) {
  rows.push({
    id: i,
    product: names[i % names.length] + " #" + i,
    category: categories[i % categories.length],
    price: 20 + ((i * 37) % 1500),
    stock: (i * 13) % 500
  });
}

anychart.onDocumentReady(function () {

  // create a data sheet
  var chart = anychart.dataSheet(rows);

  // declare the columns
  chart.column(0, {field: "id", title: "ID", dataType: "number", width: 80});
  chart.column(1, {field: "product", title: "Product", width: 220});
  chart.column(2, {field: "category", title: "Category", width: 140});
  chart.column(3, {field: "price", title: "Price", dataType: "number", width: 120});
  chart.column(4, {field: "stock", title: "In Stock", dataType: "number", width: 120});

  // virtual scrolling is on by default: keep 25 extra rows above and below the visible rows
  chart.virtualScroll().bufferSize(25);

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();

  // count the row elements that really exist in the page
  var container = document.getElementById("container");
  var readout = document.getElementById("readout");
  setInterval(function () {
    var inPage = container.getElementsByClassName("anychart-ds-row").length;
    readout.innerHTML = "Rows in the data: " + rows.length +
                        " | Row elements in the page: " + inPage;
  }, 300);
});
</script>
</body>
</html>
