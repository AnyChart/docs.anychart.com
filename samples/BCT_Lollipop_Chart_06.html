<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 06"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var data = [
    {x: "January", value: 10000},{x: "February", value: 12000},{x: "March", value: 18000},{x: "April", value: 11000},{x: "May", value: 9000}
  ];

  var chart = anychart.lollipop();
  chart.title("Lollipop Chart: Labels");

  var series = chart.lollipop(data);
  series.labels().enabled(true);
  series.labels().format("{%value}");
  series.labels().anchor("center-bottom");
  series.labels().offsetY(10);

  // set the container id and draw
  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
