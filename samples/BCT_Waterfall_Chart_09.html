<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waterfall Chart 09"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-base.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-waterfall.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/8.13.0/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />
    
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // create data   
    // drawConnector: false in the '2023' point force chart not to draw a connector from it to the next point
    var data = [
      {x: "2022", value:  23},
      {x: "Q1",   value:  -12},
      {x: "Q2",   value: 16},
      {x: "Q3",   value:  9},
      {x: "Q4",   value:  7},
      {x: "2023", isTotal: true, drawConnector: false},
      {x: "Total", isTotal: true},
    ];

    // create a waterfall chart
    var chart = anychart.waterfall();

    // create a series and set the data
    var series = chart.waterfall(data);
  
    // set the chart title
    chart.title("Waterfall Chart: Omit Connector");
    
    // set the data mode
    chart.dataMode("diff");

    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();
});
</script>
</body>
</html>
