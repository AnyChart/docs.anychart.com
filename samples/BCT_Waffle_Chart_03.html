<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-waffle.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Rows
        <input type="range" min="1" max="30" step="1" value="5" oninput="changeRows(this.value)">
        <output id="rowsValue">5</output>
    </label>
    <label>Columns
        <input type="range" min="1" max="30" step="1" value="20" oninput="changeColumns(this.value)">
        <output id="columnsValue">20</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    {name: "In-store", value: 43},
    {name: "Online", value: 31},
    {name: "Wholesale", value: 17},
    {name: "Other", value: 9}
  ];

  // create a waffle chart and set the data
  chart = anychart.waffle(data);

  // set the chart title and separate it from the grid
  chart.title("Waffle Chart: Grid Layout");
  chart.title().padding(0, 0, 20, 0);

  // change the default 10x10 grid
  chart.rows(5);
  chart.columns(20);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// change the number of grid rows: the chart redraws itself
function changeRows(value) {
  chart.rows(value);
  document.getElementById("rowsValue").value = value;
}

// change the number of grid columns: the chart redraws itself
function changeColumns(value) {
  chart.columns(value);
  document.getElementById("columnsValue").value = value;
}
</script>
</body>
</html>
