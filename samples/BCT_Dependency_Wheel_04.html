<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dependency Wheel 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-dependency-wheel.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var data = [
    {from: "Coal", to: "Grid", weight: 38},
    {from: "Gas", to: "Grid", weight: 46},
    {from: "Nuclear", to: "Grid", weight: 22},
    {from: "Hydro", to: "Grid", weight: 17},
    {from: "Solar", to: "Grid", weight: 11},
    {from: "Coal", to: "Heat", weight: 9},
    {from: "Gas", to: "Heat", weight: 24},
    {from: "Grid", to: "Industry", weight: 41},
    {from: "Grid", to: "Buildings", weight: 52},
    {from: "Grid", to: "Transport", weight: 19},
    {from: "Heat", to: "Industry", weight: 18},
    {from: "Heat", to: "Buildings", weight: 21}
  ];

  var chart = anychart.dependencyWheel(data);
  chart.title("Dependency Wheel: Geometry");

  // rotate the whole wheel a quarter-turn
  chart.startAngle(90);

  // widen the gaps between the node arcs (in radians)
  chart.padAngle(0.06);

  // make the node arcs thicker
  chart.nodeWidth(30);

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
