<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dumbbell Chart 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns of a data set (three fields: x, low, high)
  var dataSet = anychart.data.set([
    ["Job A", 40000, 60000],["Job B", 50000, 80000],["Job C", 35000, 55000]
  ]);
  var mapping = dataSet.mapAs({x: 0, low: 1, high: 2});

  var chart = anychart.dumbbell();
  chart.title("Dumbbell Chart: Data via data.set");
  var series = chart.dumbbell(mapping);

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
