<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Arc Diagram 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // map the columns of a data set (three fields: from, to, weight)
  var dataSet = anychart.data.set([
    ["Asia", "Europe", 42],
    ["Asia", "N. America", 51],
    ["Asia", "Oceania", 18],
    ["Africa", "Europe", 38],
    ["Africa", "N. America", 9],
    ["S. America", "N. America", 44],
    ["S. America", "Europe", 16],
    ["Europe", "N. America", 33],
    ["N. America", "Oceania", 7],
    ["Oceania", "Asia", 6]
  ]);
  var mapping = dataSet.mapAs({from: 0, to: 1, weight: 2});

  var chart = anychart.arcDiagram(mapping);
  chart.title("Arc Diagram: Data via data.set");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
