<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Stream Graph 10"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  var searchData = [
    ["W1", 42],["W2", 45],["W3", 40],["W4", 38],["W5", 44],
    ["W6", 50],["W7", 55],["W8", 52],["W9", 48],["W10", 46]
  ];
  var socialData = [
    ["W1", 30],["W2", 33],["W3", 36],["W4", 40],["W5", 38],
    ["W6", 35],["W7", 37],["W8", 42],["W9", 46],["W10", 49]
  ];
  var emailData = [
    ["W1", 18],["W2", 20],["W3", 19],["W4", 22],["W5", 24],
    ["W6", 23],["W7", 21],["W8", 20],["W9", 22],["W10", 25]
  ];
  var directData = [
    ["W1", 25],["W2", 22],["W3", 20],["W4", 24],["W5", 29],
    ["W6", 31],["W7", 27],["W8", 23],["W9", 21],["W10", 24]
  ];
  var referralData = [
    ["W1", 10],["W2", 14],["W3", 19],["W4", 23],["W5", 20],
    ["W6", 15],["W7", 12],["W8", 16],["W9", 21],["W10", 18]
  ];
  var videoData = [
    ["W1", 8],["W2", 12],["W3", 18],["W4", 26],["W5", 31],
    ["W6", 27],["W7", 22],["W8", 28],["W9", 34],["W10", 30]
  ];

  var chart = anychart.streamGraph();
  chart.title("Stream Graph: Expand Offset");

  var series1 = chart.splineArea(searchData);
  series1.name("Search");
  var series2 = chart.splineArea(socialData);
  series2.name("Social");
  var series3 = chart.splineArea(emailData);
  series3.name("Email");
  var series4 = chart.splineArea(directData);
  series4.name("Direct");
  var series5 = chart.splineArea(referralData);
  series5.name("Referral");
  var series6 = chart.splineArea(videoData);
  series6.name("Video");

  // give every category the same total height to compare shares
  chart.offset("expand");

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
