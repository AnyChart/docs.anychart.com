<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Stream Graph 05"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-stream-graph.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Series type:</span>
    <label><input type="radio" name="seriesType" onclick="changeSeriesType('spline-area')"> spline-area</label>
    <label><input type="radio" name="seriesType" onclick="changeSeriesType('area')"> area</label>
    <label><input type="radio" name="seriesType" onclick="changeSeriesType('step-area')" checked> step-area</label>
</div>
<div id="container"></div>
<script>
var chart;
anychart.onDocumentReady(function () {
  // create data
  var searchData = [
    ["W1", 42],["W2", 45],["W3", 40],["W4", 38],["W5", 44],
    ["W6", 50],["W7", 55],["W8", 52],["W9", 48],["W10", 46]
  ];
  var socialData = [
    ["W1", 30],["W2", 33],["W3", 36],["W4", 40],["W5", 38],
    ["W6", 35],["W7", 37],["W8", 42],["W9", 46],["W10", 49]
  ];
  var emailData = [
    ["W1", 18],["W2", 20],["W3", 19],["W4", 22],["W5", 24],
    ["W6", 23],["W7", 21],["W8", 20],["W9", 22],["W10", 25]
  ];

  // create a chart
  chart = anychart.streamGraph();
  // set the chart title
  chart.title("Stream Graph: Series Type");

  // layers drawn as step-area series
  var series1 = chart.stepArea(searchData);
  series1.name("Search");
  var series2 = chart.stepArea(socialData);
  series2.name("Social");
  var series3 = chart.stepArea(emailData);
  series3.name("Email");

  // the layer labels are a spline-area default: set them for every type
  chart.maxLabels().enabled(true);
  chart.maxLabels().format("{%seriesName}");

  // make the layer labels readable
  chart.maxLabels().fontColor("#000000");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// apply the chosen type to every layer: the chart redraws itself
function changeSeriesType(value) {
  for (var i = 0; i < chart.getSeriesCount(); i++) {
    chart.getSeriesAt(i).seriesType(value);
  }
}
</script>
</body>
</html>
