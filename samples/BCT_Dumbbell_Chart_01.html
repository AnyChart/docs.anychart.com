<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dumbbell Chart 01"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    {x: "Job A", low: 40000, high: 60000},
    {x: "Job B", low: 50000, high: 80000},
    {x: "Job C", low: 35000, high: 55000}
  ];

  // create a chart
  var chart = anychart.dumbbell();
  // create a dumbbell series and set the data
  var series = chart.dumbbell(data);
  // set the chart title and separate it from the plot
  chart.title("Dumbbell Chart: Basic Sample");
  chart.title().padding(0, 0, 20, 0);

  // show both endpoint values in the tooltip
  series.tooltip().format("High: {%high}, Low: {%low}");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
