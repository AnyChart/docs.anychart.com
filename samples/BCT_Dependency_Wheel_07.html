<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dependency Wheel 07"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-dependency-wheel.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Start angle
        <input type="range" min="0" max="345" step="15" value="90" oninput="changeStartAngle(this.value)">
        <output id="startAngleValue">90</output>
    </label>
    <label>Pad angle
        <input type="range" min="0" max="10" step="0.5" value="3" oninput="changePadAngle(this.value)">
        <output id="padAngleValue">3</output>
    </label>
    <label>Node width
        <input type="range" min="5" max="40" step="1" value="30" oninput="changeNodeWidth(this.value)">
        <output id="nodeWidthValue">30</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: weekly flights between the cities
  var data = [
    {from: "Paris", to: "Tokyo", weight: 18},
    {from: "Paris", to: "NYC", weight: 14},
    {from: "Paris", to: "Dubai", weight: 8},
    {from: "Tokyo", to: "NYC", weight: 10},
    {from: "Tokyo", to: "Dubai", weight: 5},
    {from: "NYC", to: "Cairo", weight: 6},
    {from: "Dubai", to: "Cairo", weight: 4}
  ];

  // create a chart and set the data
  chart = anychart.dependencyWheel(data);
  // set the chart title
  chart.title("Dependency Wheel: Geometry");

  // rotate the whole wheel a quarter-turn
  chart.startAngle(90);

  // widen the gaps between the node arcs
  chart.padAngle(3);

  // make the node arcs thicker
  chart.nodeWidth(30);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// rotate the wheel: the chart redraws itself
function changeStartAngle(value) {
  chart.startAngle(value);
  document.getElementById("startAngleValue").value = value;
}

// resize the gaps between the node arcs
function changePadAngle(value) {
  chart.padAngle(value);
  document.getElementById("padAngleValue").value = value;
}

// set the thickness of the node arcs
function changeNodeWidth(value) {
  chart.nodeWidth(value);
  document.getElementById("nodeWidthValue").value = value;
}
</script>
</body>
</html>
