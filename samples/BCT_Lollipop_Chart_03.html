<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-bundle.min.js"></script>

    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data with individual point settings
  var data = [
    {x: "January", value: 10000},
    {x: "February", value: 12000},
    {x: "March", value: 18000,
     normal:   {
                 stroke: "3 #5cd65c",
                 fill: "#5cd65c"
               },
     hovered:  {
                 stroke: "4 #5cd65c",
                 fill: "#5cd65c"
               },
     selected: {
                 stroke: "4 #5cd65c",
                 fill: "#5cd65c"
               }
    },
    {x: "April", value: 11000},
    {x: "May", value: 9000}
  ];

  // create a column chart
  var chart = anychart.column();
  chart.title("Lollipop Chart: Individual Points");

  // create a lollipop series and set the data
  var series = chart.lollipop(data);

  chart.container("container");
  chart.draw();
});
</script>
</body>
</html>
