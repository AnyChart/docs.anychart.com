<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Lollipop Chart 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data for two series
  var seriesData_1 = [
    {x: "January", value: 10000},
    {x: "February", value: 12000},
    {x: "March", value: 18000},
    {x: "April", value: 11000},
    {x: "May", value: 9000}
  ];
  var seriesData_2 = [
    {x: "January", value: 7000},
    {x: "February", value: 9000},
    {x: "March", value: 13000},
    {x: "April", value: 8000},
    {x: "May", value: 6000}
  ];

  // create a lollipop chart
  var chart = anychart.lollipop();

  // set the chart title
  chart.title("Lollipop Chart: Head");

  // create the first lollipop series and set the data
  var series1 = chart.lollipop(seriesData_1);
  // set the shape and the size of the heads
  series1.markers().type("circle");
  series1.markers().size(10);
  // set the shape and the size in the hovered and selected states
  series1.hovered().markers().type("star5");
  series1.hovered().markers().size(12);
  series1.selected().markers().type("star5");
  series1.selected().markers().size(12);

  // create the second lollipop series and set the data
  var series2 = chart.lollipop(seriesData_2);
  // set a different head shape for the second series
  series2.markers().type("square");
  series2.markers().size(10);
  // set the shape and the size in the hovered and selected states
  series2.hovered().markers().type("diamond");
  series2.hovered().markers().size(12);
  series2.selected().markers().type("diamond");
  series2.selected().markers().size(12);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
