<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 14"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<button onclick="expandAll()">Expand all</button>
<button onclick="collapseAll()">Collapse all</button>
<div id="container"></div>
<script>
var chart;

// create data
var rows = [
  {id: 1, product: "Laptop", category: "Tech", price: 1200, stock: 34},
  {id: 2, product: "Chair", category: "Office", price: 150, stock: 120},
  {id: 3, product: "Monitor", category: "Tech", price: 300, stock: 58},
  {id: 4, product: "Desk", category: "Office", price: 450, stock: 12},
  {id: 5, product: "Keyboard", category: "Tech", price: 80, stock: 240},
  {id: 6, product: "Lamp", category: "Office", price: 45, stock: 60},
  {id: 7, product: "Headset", category: "Tech", price: 140, stock: 76},
  {id: 8, product: "Cabinet", category: "Storage", price: 320, stock: 18},
  {id: 9, product: "Shelf", category: "Storage", price: 210, stock: 42}
];

anychart.onDocumentReady(function () {

  // create a data sheet
  chart = anychart.dataSheet(rows);

  // declare the columns
  chart.column(0, {field: "product", title: "Product", width: 200});
  chart.column(1, {field: "category", title: "Category", width: 120});
  chart.column(2, {field: "price", title: "Price", dataType: "number", width: 100});
  chart.column(3, {field: "stock", title: "In Stock", dataType: "number", width: 100});

  // group the rows by category and summarize each group
  chart.groupBy("category", {aggregates: {price: "sum", stock: "avg"}});

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();
});

// open every group
function expandAll() {
  chart.hierarchy().expandAll();
  chart.draw();
}

// close every group
function collapseAll() {
  chart.hierarchy().collapseAll();
  chart.draw();
}
</script>
</body>
</html>
