<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Calendar Chart 11"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-calendar.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; margin: 0; padding: 0; }
        /* the container is deliberately too short for three years of data */
        #container { width: 100%; height: 200px; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data spanning three years
  var data = [
    {x: "2020-01-12", value: 6},
    {x: "2020-02-19", value: 9},
    {x: "2020-05-14", value: 1},
    {x: "2020-09-03", value: 4},
    {x: "2020-12-24", value: 7},
    {x: "2021-01-12", value: 2},
    {x: "2021-04-20", value: 4},
    {x: "2021-07-11", value: 8},
    {x: "2021-11-05", value: 3},
    {x: "2022-02-08", value: 5},
    {x: "2022-06-17", value: 1},
    {x: "2022-10-29", value: 9}
  ];

  // create a chart and set the data
  var chart = anychart.calendar(data);

  // set the chart title
  chart.title("Calendar Chart: Auto Height");

  // let the chart grow its own container to the height it needs
  chart.autoHeight(true);

  // set the container id
  chart.container("container");

  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
