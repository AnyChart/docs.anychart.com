<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Org Chart 18"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-org.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Middle marker:</span>
    <label><input type="radio" name="middleMarker" onclick="changeMiddleMarker('none')"> none</label>
    <label><input type="radio" name="middleMarker" onclick="changeMiddleMarker('diamond')" checked> diamond</label>
    <label><input type="radio" name="middleMarker" onclick="changeMiddleMarker('square')"> square</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: a flat table with id/parent references
  var data = [
    {id: "ceo", name: "Sarah Johnson", title: "CEO"},
    {id: "cto", parent: "ceo", name: "Michael Chen", title: "CTO"},
    {id: "cfo", parent: "ceo", name: "Emily Davis", title: "CFO"},
    {id: "coo", parent: "ceo", name: "Robert Wilson", title: "COO"},
    {id: "eng", parent: "cto", name: "David Kim", title: "Head of Engineering"},
    {id: "prod", parent: "cto", name: "Lisa Zhang", title: "Head of Product"},
    {id: "acct", parent: "cfo", name: "Diana Ross", title: "Head of Accounting"},
    {id: "ops", parent: "coo", name: "Peter Jackson", title: "Head of Operations"},
    {id: "fe", parent: "eng", name: "Anna Lee", title: "Frontend Lead"},
    {id: "be", parent: "eng", name: "Tom Harris", title: "Backend Lead", connectorEndMarker: {fill: "#43a047"}}
  ];

  // create an org chart and set the data
  chart = anychart.orgChart(data, "as-table");
  // set the chart title
  chart.title("Org Chart: Connector Markers");

  // a dot at the parent end, a diamond in the middle, and an arrowhead at the child end
  chart.connectorStartMarker({enabled: true, type: "circle", size: 5});
  chart.connectorMiddleMarker({enabled: true, type: "diamond", size: 8});
  chart.connectorEndMarker({enabled: true, type: "arrowhead", size: 14, fill: "#1976d2"});

  // the connectors into the second level: an orange arrowhead
  chart.level(1, {connectorEndMarker: {fill: "#f57c00"}});

  // add the zoom control
  var zoomController = anychart.ui.zoom();
  zoomController.target(chart);
  zoomController.render();

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// change the type of the middle marker, or turn it off
function changeMiddleMarker(value) {
  chart.connectorMiddleMarker({enabled: value != "none", type: value, size: 8});
}
</script>
</body>
</html>
