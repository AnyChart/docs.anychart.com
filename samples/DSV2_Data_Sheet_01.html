<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 01"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

  // create data
  var data = [
    {product: "Laptop", category: "Tech", price: 1200, units: 34, date: "2024-03-15", inStock: true},
    {product: "Chair", category: "Office", price: 150, units: 120, date: "2024-01-15", inStock: true},
    {product: "Monitor", category: "Tech", price: 300, units: 58, date: "2024-02-15", inStock: true},
    {product: "Desk", category: "Office", price: 450, units: 12, date: "2024-01-15", inStock: true},
    {product: "Keyboard", category: "Tech", price: 80, units: 240, date: "2024-04-15", inStock: true},
    {product: "Lamp", category: "Office", price: 45, units: 0, date: "2024-05-15", inStock: false},
    {product: "Headset", category: "Tech", price: 220, units: 76, date: "2024-03-15", inStock: true},
    {product: "Cabinet", category: "Office", price: 640, units: 8, date: "2024-02-15", inStock: true}
  ];

  // create a data sheet: one column per field, no declarations needed
  var chart = anychart.dataSheet(data);

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();
});
</script>
</body>
</html>
