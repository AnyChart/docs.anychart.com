<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content=""/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>
    
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-base.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-gantt.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4" type="text/javascript"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />
    
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // create data
    var data = [
      {
        id: "1",
        name: "Development",
        baselineStart: "2026-01-16",
        baselineEnd: "2026-03-08",
        actualStart: "2026-01-19",
        actualEnd: "2026-03-14",
        children: [
          {
            id: "1_1",
            name: "Analysis",
            baselineStart: "2026-01-16",
            baselineEnd: "2026-01-29",
            actualStart: "2026-01-19",
            actualEnd: "2026-01-29"
          },
          {
            id: "1_2",
            name: "Design",
            baselineStart: "2026-01-24",
            baselineEnd: "2026-02-04",
            actualStart: "2026-01-24",
            actualEnd: "2026-02-08"
          },
          {
            id: "1_3",
            name: "Meeting",
            actualStart: "2026-02-09",
            actualEnd: "2026-02-09"
          },
          {
            id: "1_4",
            name: "Implementation",
            baselineStart: "2026-02-05",
            baselineEnd: "2026-02-23",
            actualStart: "2026-02-09",
            actualEnd: "2026-02-28"
          },
          {
            id: "1_5",
            name: "Testing",
            baselineStart: "2026-02-24",
            baselineEnd: "2026-03-09",
            actualStart: "2026-03-01",
            actualEnd: "2026-03-14"
          }
      ]}
    ];
    
    // create a data tree
    var treeData = anychart.data.tree(data, "as-tree");

    // create a chart
    var chart = anychart.ganttProject();
    
    // set the data
    chart.data(treeData);

    // configure the scale
    chart.getTimeline().scale().maximum("2026-03-19");
    
    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();

    // fit elements to the width of the timeline
    chart.fitAll();
});
</script>
</body>
</html>
