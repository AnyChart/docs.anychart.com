<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<button onclick="addRowSameArray()">Add row, same array</button>
<button onclick="addRowNewArray()">Add row, new array</button>
<div id="container"></div>
<script>
var chart;

// create data
var rows = [
  {id: 1, product: "Laptop", category: "Tech", price: 1200, stock: 34},
  {id: 2, product: "Chair", category: "Office", price: 150, stock: 120},
  {id: 3, product: "Monitor", category: "Tech", price: 300, stock: 58},
  {id: 4, product: "Desk", category: "Office", price: 450, stock: 12},
  {id: 5, product: "Keyboard", category: "Tech", price: 80, stock: 240},
  {id: 6, product: "Lamp", category: "Office", price: 45, stock: 0}
];

anychart.onDocumentReady(function () {

  // create a data sheet
  chart = anychart.dataSheet(rows);

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();
});

// build one more row
function nextRow() {
  var n = rows.length + 1;
  return {id: n, product: "Product " + n, category: "Tech", price: 100 * n, stock: 10 * n};
}

// this does nothing: the data sheet already holds this array
function addRowSameArray() {
  rows.push(nextRow());
  chart.data(rows);
  chart.draw();
}

// this works: the data sheet gets a new array
function addRowNewArray() {
  rows.push(nextRow());
  rows = rows.slice();
  chart.data(rows);
  chart.draw();
}
</script>
</body>
</html>
