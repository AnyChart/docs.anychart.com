<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Org Chart 09"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-org-chart.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <button onclick="collapseAllBranches()">Collapse all</button>
    <button onclick="expandAllBranches()">Expand all</button>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: a flat table with id/parent references
  var data = [
    {id: "ceo", name: "Sarah Johnson", title: "CEO"},
    {id: "cto", parent: "ceo", name: "Michael Chen", title: "CTO"},
    {id: "cfo", parent: "ceo", name: "Emily Davis", title: "CFO"},
    {id: "coo", parent: "ceo", name: "Robert Wilson", title: "COO"},
    {id: "eng", parent: "cto", name: "David Kim", title: "Head of Engineering"},
    {id: "prod", parent: "cto", name: "Lisa Zhang", title: "Head of Product"},
    {id: "acct", parent: "cfo", name: "Diana Ross", title: "Head of Accounting"},
    {id: "ops", parent: "coo", name: "Peter Jackson", title: "Head of Operations"},
    {id: "fe", parent: "eng", name: "Anna Lee", title: "Frontend Lead"},
    {id: "be", parent: "eng", name: "Tom Harris", title: "Backend Lead"}
  ];

  // create an org chart and set the data
  chart = anychart.orgChart(data, "as-table");
  // set the chart title
  chart.title("Org Chart: Collapse and Expand");

  // collapse the CTO branch by the node id
  chart.collapse("cto");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// collapse all branches at once
function collapseAllBranches() {
  chart.collapseAll();
}

// expand all branches at once
function expandAllBranches() {
  chart.expandAll();
}
</script>
</body>
</html>
