<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DSV2 Data Sheet 03"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/data-sheet.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        .grid { width: 100%; height: 33%; }
    </style>
</head>
<body>
<div id="objects" class="grid"></div>
<div id="arrays" class="grid"></div>
<div id="csv" class="grid"></div>
<script>
anychart.onDocumentReady(function () {

  // an array of row objects: the keys of the first row become the columns
  var rows = [
    {product: "Laptop", category: "Tech", price: 1200, units: 34},
    {product: "Chair", category: "Office", price: 150, units: 120},
    {product: "Monitor", category: "Tech", price: 300, units: 58}
  ];

  // create a data sheet from the array of row objects
  var objectGrid = anychart.dataSheet(rows);

  // set the container id
  objectGrid.container("objects");

  // initiate drawing the data sheet
  objectGrid.draw();

  // an array of arrays: the columns are positional, titled 0, 1, and on
  var cells = [
    ["Laptop", "Tech", 1200, 34],
    ["Chair", "Office", 150, 120],
    ["Monitor", "Tech", 300, 58]
  ];

  // create a data sheet from the array of arrays
  var arrayGrid = anychart.dataSheet(cells);

  // set the container id
  arrayGrid.container("arrays");

  // initiate drawing the data sheet
  arrayGrid.draw();

  // CSV text: the header line is taken verbatim as the column keys
  var csv = "product,category,price,units\n" +
    "Laptop,Tech,1200,34\n" +
    "Chair,Office,150,120\n" +
    "Monitor,Tech,300,58";

  // create a data sheet from the CSV text
  var csvGrid = anychart.dataSheet(csv);

  // set the container id
  csvGrid.container("csv");

  // initiate drawing the data sheet
  csvGrid.draw();
});
</script>
</body>
</html>
