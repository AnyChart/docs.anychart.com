<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Network Graph 16"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-graph.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-exports.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-ui.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>

    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css?hcode=a0c21fc77e1449cc86299c5faa067dc4" />

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls span { font-weight: 600; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Use the mouse wheel to:</span>
    <label><input onclick="enableZoom()" type="radio" name="mode" checked> zoom</label>
    <label><input onclick="enableScroll()" type="radio" name="mode"> scroll</label>
    <label><input onclick="disableZoomAndScroll()" type="radio" name="mode"> nothing</label>
    <span>Panning bounds:</span>
    <label><input onclick="boundsFree()" type="radio" name="bounds" checked> free</label>
    <label><input onclick="boundsContain()" type="radio" name="bounds"> contain</label>
    <label><input onclick="boundsAutoCenter()" type="radio" name="bounds"> auto-center</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // create data
    var data = {
      nodes: [
        {id: "Richard"},
        {id: "Larry"},
        {id: "Marta"},
        {id: "Jane"},
        {id: "Norma"},
        {id: "Frank"},
        {id: "Brett"},
        {id: "Tommy"}
      ],
      edges: [
        {from: "Richard", to: "Larry"},
        {from: "Richard", to: "Marta"},
        {from: "Larry",   to: "Marta"},
        {from: "Marta",   to: "Jane"},
        {from: "Jane",    to: "Norma"},
        {from: "Jane",    to: "Frank"},
        {from: "Jane",    to: "Brett"},
        {from: "Brett",   to: "Frank"}
      ]
    };

    // create a chart and set the data
    chart = anychart.graph(data);

    // set the chart title
    chart.title("Network Graph: Chart Behavior");

    // set the container id
    chart.container("container");

    // initiate drawing the chart
    chart.draw();
});

// allow zooming the chart with the mouse wheel
function enableZoom() {
  chart.interactivity().zoomOnMouseWheel(true);
}

// allow scrolling the chart with the mouse wheel
function enableScroll() {
  chart.interactivity().scrollOnMouseWheel(true);
}

// prevent zooming and scrolling the chart with the mouse wheel
function disableZoomAndScroll() {
  chart.interactivity().zoomOnMouseWheel(false);
  chart.interactivity().scrollOnMouseWheel(false);
}

// allow dragging the chart anywhere (the default)
function boundsFree() {
  chart.interactivity().boundsMode("free");
}

// keep the chart inside its container
function boundsContain() {
  chart.interactivity().boundsMode("contain");
}

// slide the chart back to the center once it is dragged fully out of view
function boundsAutoCenter() {
  chart.interactivity().boundsMode("auto-center");
}
</script>
</body>
</html>
