<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 04"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-waffle.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Cell shape:</span>
    <label><input type="radio" name="cellShape" onclick="changeCellShape('square')" checked> square</label>
    <label><input type="radio" name="cellShape" onclick="changeCellShape('circle')"> circle</label>
    <label id="cornerRadiusControl">Corner radius
        <input type="range" min="0" max="8" step="1" value="4" oninput="changeCellCornerRadius(this.value)">
        <output id="cornerRadiusValue">4</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    {name: "In-store", value: 43},
    {name: "Online", value: 31},
    {name: "Wholesale", value: 17},
    {name: "Other", value: 9}
  ];

  // create a waffle chart and set the data
  chart = anychart.waffle(data);

  // set the chart title and separate it from the grid
  chart.title("Waffle Chart: Cell Shape");
  chart.title().padding(0, 0, 20, 0);

  // draw square cells and round their corners
  chart.cellShape("square");
  chart.cellCornerRadius(4);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// switch the shape of the cells: the corner radius applies to squares only, so its slider hides for circles
function changeCellShape(value) {
  chart.cellShape(value);
  document.getElementById("cornerRadiusControl").style.display = value === "square" ? "" : "none";
}

// round the corners of square cells: circle cells ignore the radius
function changeCellCornerRadius(value) {
  chart.cellCornerRadius(value);
  document.getElementById("cornerRadiusValue").value = value;
}
</script>
</body>
</html>
