    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-stock.min.js?hcode=a0c21fc77e1449cc86299c5faa067dc4"></script>

<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {

    // set the data
    table = anychart.data.table('x');
    table.addData([
{x: "2024-01-06", low: 2, high: 6},
{x: "2024-02-06", low: 2, high: 7},
{x: "2024-03-06", low: 3, high: 10},
{x: "2024-04-06", low: 5, high: 13},
{x: "2024-05-06", low: 8, high: 17},
{x: "2024-06-06", low: 11, high: 20},
{x: "2024-07-06", low: 13, high: 22},
{x: "2024-08-06", low: 13, high: 21},
{x: "2024-09-06", low: 11, high: 19},
{x: "2024-10-06", low: 8, high: 14},
{x: "2024-11-06", low: 5, high: 10},
{x: "2024-12-06", low: 5, high: 7},
{x: "2025-01-06", low: 3, high: 7},
{x: "2025-02-06", low: 4, high: 7},
{x: "2025-03-06", low: 5, high: 8},
{x: "2025-04-06", low: 7, high: 12},
{x: "2025-05-06", low: 7, high: 14},

{x: "2026-06-06", low: 18, high: 19},
{x: "2026-07-06", low: 19, high: 22}
    ]);
  
    // map the data
    mapping = table.mapAs({x:'x', high:'high', low: 'low'});

    // chart type
    var chart = anychart.stock();

    // set the series
    var series = chart.plot(0).rangeSplineArea(mapping);
    series.name("London");

    chart.title('Temperature range \n2000-2004');

    // display the chart
    chart.container('container');
    chart.draw();
});
</script>
</body>
