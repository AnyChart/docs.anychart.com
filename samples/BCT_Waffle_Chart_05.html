<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 05"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-waffle.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 14px; }
        #controls input[type="range"] { width: 90px; vertical-align: middle; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <label>Padding
        <input type="range" min="1" max="8" step="1" value="4" oninput="changeCellPadding(this.value)">
        <output id="paddingValue">4</output>
    </label>
    <label>Cell height
        <input type="range" min="10" max="20" step="1" value="20" oninput="changeCellSize(this.value)">
        <output id="cellSizeValue">20</output>
    </label>
    <label>Aspect ratio
        <input type="range" min="0.5" max="2" step="0.1" value="2" oninput="changeCellAspectRatio(this.value)">
        <output id="aspectRatioValue">2</output>
    </label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data
  var data = [
    {name: "In-store", value: 43},
    {name: "Online", value: 31},
    {name: "Wholesale", value: 17},
    {name: "Other", value: 9}
  ];

  // create a waffle chart and set the data
  chart = anychart.waffle(data);

  // set the chart title
  chart.title("Waffle Chart: Cell Size");

  // widen the gaps between the cells
  chart.cellPadding(4);

  // fixed cell height, cells twice as wide as they are high
  chart.cellSize(20);
  chart.cellAspectRatio(2);

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// change the gap between the cells: the chart redraws itself
function changeCellPadding(value) {
  chart.cellPadding(value);
  document.getElementById("paddingValue").value = value;
}

// change the fixed cell height: the chart redraws itself
function changeCellSize(value) {
  chart.cellSize(value);
  document.getElementById("cellSizeValue").value = value;
}

// change the width-to-height ratio of the cells: the chart redraws itself
function changeCellAspectRatio(value) {
  chart.cellAspectRatio(value);
  document.getElementById("aspectRatioValue").value = value;
}
</script>
</body>
</html>
