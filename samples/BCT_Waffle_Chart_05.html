<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Waffle Chart 05"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-waffle.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; }
        #controls { padding: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        #controls label { margin-right: 20px; }
        #container { flex: 1; }
    </style>
</head>
<body>
<div id="controls">
    <span>Fill direction:</span>
    <label><input type="radio" name="direction" id="directionLeftToRight" onclick="changeFillDirection('left-to-right')"> left-to-right</label>
    <label><input type="radio" name="direction" id="directionRightToLeft" onclick="changeFillDirection('right-to-left')"> right-to-left</label>
    <label><input type="radio" name="direction" id="directionTopToBottom" onclick="changeFillDirection('top-to-bottom')"> top-to-bottom</label>
    <label><input type="radio" name="direction" id="directionBottomToTop" onclick="changeFillDirection('bottom-to-top')" checked> bottom-to-top</label>
</div>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // a progress-style waffle: the share completed vs the remainder
  var data = [
    {name: "Completed", value: 68},
    {name: "Remaining", value: 32}
  ];

  // create a waffle chart and set the data
  chart = anychart.waffle(data);

  // set the chart title and separate it from the grid
  chart.title("Waffle Chart: Fill Direction");
  chart.title().padding(0, 0, 20, 0);

  // contrast the two categories so the fill direction stays visible
  chart.palette(["#1976d2", "#e3e9ef"]);

  // fill the grid from the bottom up
  chart.fillDirection("bottom-to-top");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});

// apply the chosen fill direction: the chart redraws itself
function changeFillDirection(direction) {
  chart.fillDirection(direction);
}
</script>
</body>
</html>
