<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="DS Data Sheet 15"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/{{branch-name}}/js/anychart-data-sheet.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/css/anychart-ui.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/{{branch-name}}/fonts/css/anychart-font.min.css" />

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }

        /* what the API does not cover, CSS does */
        #container .anychart-ds-header-cell {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #container .anychart-ds-cell {
            padding: 0 16px;
            border-right: 1px solid #b0bec5;
        }
        /* the API has no alignment setting - a number cell carries its own class */
        #container .anychart-ds-cell-number {
            text-align: right;
        }
    </style>
</head>
<body>
<div id="container"></div>
<script>

// create data
var rows = [
  {id: 1, product: "Laptop", category: "Tech", price: 1200, stock: 34},
  {id: 2, product: "Chair", category: "Office", price: 150, stock: 120},
  {id: 3, product: "Monitor", category: "Tech", price: 300, stock: 58},
  {id: 4, product: "Desk", category: "Office", price: 450, stock: 12},
  {id: 5, product: "Keyboard", category: "Tech", price: 80, stock: 240},
  {id: 6, product: "Lamp", category: "Office", price: 45, stock: 60}
];

anychart.onDocumentReady(function () {

  // create a data sheet
  var chart = anychart.dataSheet(rows);

  // declare the columns
  chart.column(0, {field: "product", title: "Product", width: 200});
  chart.column(1, {field: "category", title: "Category", width: 140});
  chart.column(2, {field: "price", title: "Price", dataType: "number", width: 120});
  chart.column(3, {field: "stock", title: "In Stock", dataType: "number", width: 120});

  // set the row height and the header height
  chart.rowHeight(40);
  chart.header().height(52);

  // recolor the header and the rows
  chart.headerFill("#37474f");
  chart.rowEvenFill("#ffffff");
  chart.rowOddFill("#e3f2fd");
  chart.rowHoverFill("#fff8e1");
  chart.rowSelectedFill("#ffe082");

  // message shown when there is nothing to display
  chart.noDataText("No products to show");

  // set the container id
  chart.container("container");

  // initiate drawing the data sheet
  chart.draw();
});
</script>
</body>
</html>
