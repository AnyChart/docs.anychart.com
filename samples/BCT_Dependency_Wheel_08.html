<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <meta name="ac:name" content="BCT Dependency Wheel 08"/>
    <meta name="ac:short-desc" content=""/>
    <meta name="ac:desc" content=""/>

    <script src="https://cdn.anychart.com/releases/staging/js/anychart-base.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-dependency-wheel.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-exports.min.js"></script>
    <script src="https://cdn.anychart.com/releases/staging/js/anychart-ui.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.anychart.com/releases/staging/css/anychart-ui.min.css"/>

    <style>
        html, body, #container { width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="container"></div>
<script>
anychart.onDocumentReady(function () {
  // create data: weekly flights between the cities
  var data = [
    {from: "Paris", to: "Tokyo", weight: 18},
    {from: "Paris", to: "NYC", weight: 14},
    {from: "Paris", to: "Dubai", weight: 8},
    {from: "Tokyo", to: "NYC", weight: 10},
    {from: "Tokyo", to: "Dubai", weight: 5},
    {from: "NYC", to: "Cairo", weight: 6},
    {from: "Dubai", to: "Cairo", weight: 4}
  ];

  // create a chart and set the data
  var chart = anychart.dependencyWheel(data);
  // set the chart title and separate it from the wheel
  chart.title("Dependency Wheel: Tooltips");
  chart.title().padding(0, 0, 20, 0);

  // make the node arcs wider (the default is 15 px)
  chart.nodeWidth(25);

  // the tooltip of a city, built from the node tokens
  chart.node().tooltip().titleFormat("{%name}");
  chart.node().tooltip().format(
    "Routes: {%connections}\nFlights a week: {%weight}\nShare of all flights: {%percent}{decimalsCount:1}%"
  );

  // the tooltip of a link: it has its own tokens
  chart.link().tooltip().titleFormat("{%from} - {%to}");
  chart.link().tooltip().format("Flights a week: {%value}");

  // set the container id
  chart.container("container");
  // initiate drawing the chart
  chart.draw();
});
</script>
</body>
</html>
